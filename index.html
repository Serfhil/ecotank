<style>
  html, body { margin: 0; height: 100%; background: #14181c; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; box-shadow: 0 0 0 2px #2a3238, 0 12px 40px #000a; border-radius: 4px; }
  [hidden] { display: none !important; }
  button { font: 600 15px "Segoe UI", system-ui, sans-serif; color: #eef5e8; background: #2a3a2c; border: 1px solid #4f7a44; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: #355238; }
  button.ghost { background: #1d2427; border-color: #3a464c; }
  button.ghost:hover { background: #283236; }

  #dev { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,12,.55); }
  #devPanel { width: min(760px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; }
  .devHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }

  .devActions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }

  #devPanel h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb39a; }
  #devPanel table { width: 100%; border-collapse: collapse; }

  #devPanel input[type=number] { width: 100%; box-sizing: border-box; background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }

  .epanel { width: min(860px, calc(100vw - 32px)); max-height: 92vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; box-sizing: border-box; }

  .pe-row .pe-size { color: #7f8f88; }
  .pe-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  .pe-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pe-palette button { display: flex; align-items: center; gap: 6px; }
  .pe-palette button.on { border-color: #8be06a; background: #2a3a2c; }

  .pe-grid { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; user-select: none; touch-action: none; }
  .pe-grid .pe-cell { width: 30px; height: 30px; cursor: crosshair; }
  .epanel { scrollbar-color: #3a464c #161c1f; }
  .pe-thumb { width: 98px; flex: none; }
  .pe-mini { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; }
  .pe-mini .pe-cell { width: 7px; height: 7px; }
  .pe-cell { box-sizing: border-box; }
  .t-none { background: repeating-conic-gradient(#1b2226 0 25%, #252e33 0 50%) 0 0 / 10px 10px; }
  .t-clear { background: #56693f; }
  .t-B, .t-b { background: linear-gradient(#402b21 0 1px, transparent 1px 50%, #402b21 50% calc(50% + 1px), transparent 0) #b3633a; }
  .t-F { background: linear-gradient(#56693f 40%, #a57a46 40% 60%, #56693f 60%); }
  .t-S { background: #9aa6af; border: 3px solid #6f7b85; }
  .t-W { background: #2c6d96; }
  .t-P { background: repeating-linear-gradient(-8deg, #b59e64 0 5px, #c9b277 5px 6px); }
  .t-T, .t-t { background: radial-gradient(circle, #3f8a3a 55%, #2c5e2a 62%, #56693f 64%); }
  .t-b, .t-t { opacity: .5; }
  .epanel select { background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  .pe-pack { border: 1px solid #2f3a40; border-radius: 8px; padding: 8px 12px 4px; margin-top: 12px; }
  .pe-packhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 6px; }
  .pe-pack.folded { padding-bottom: 2px; }
  .pe-pack.folded .pe-packhead { padding-bottom: 6px; }
  .epanel .pe-fold { width: 30px; height: 30px; padding: 0; font-size: 14px; line-height: 1; transition: transform .15s; }
  .pe-pack.folded .pe-fold { transform: rotate(-90deg); }
  .pe-packhead b { flex: 1; min-width: 140px; color: #8be06a; font-size: 14px; }
  .pe-packhead .pe-packname { flex: 1; min-width: 140px; font-weight: 700; }
  .pe-packhead label { display: flex; align-items: center; gap: 6px; }
  .pe-warn { color: #ffc477; margin: 10px 0 0; }
  .pe-msg { min-height: 18px; margin-top: 10px; color: #ff8a7a; }
  .pe-actions { display: flex; gap: 8px; margin-top: 14px; }
  #mapEditorPanel { width: min(1180px, calc(100vw - 32px)); }
  .me-canvas { display: block; cursor: crosshair; touch-action: none; border: 1px solid #0b0f11; }
  .me-thumb { display: block; flex: none; border: 1px solid #0b0f11; }
  .me-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: #9fb39a; font-size: 12px; }
  .me-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }

<script>
'use strict';
applyInterfaceTexts();
// ---------- базовые константы и утилиты ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const turnTo = (a, b, s) => { const d = angDiff(a, b); return Math.abs(d) <= s ? b : a + Math.sign(d) * s; };

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function roundedPolygon(c,points,amount) {
  points.forEach(([x,y],i)=>{
    const prev=points[(i+points.length-1)%points.length],next=points[(i+1)%points.length];
    const ax=x+(prev[0]-x)*amount,ay=y+(prev[1]-y)*amount,bx=x+(next[0]-x)*amount,by=y+(next[1]-y)*amount;
    if(!i)c.moveTo(ax,ay);else c.lineTo(ax,ay);
    c.quadraticCurveTo(x,y,bx,by);
  });c.closePath();
}

// ---------- подключение звука ----------
initAudio();

// Поле расстояний для ИИ; данные карты принадлежат world.js.
function buildFlow(tc, tr) {
  flow.fill(1e9);
  const s = tr * COLS + tc, q = [s];
  flow[s] = 0;
  for (let h = 0; h < q.length; h++) {
    const i = q[h], c = i % COLS, r = (i / COLS) | 0;
    for (const [dc, dr] of DIRS) {
      const nc = c + dc, nr = r + dr, t = tileAt(nc, nr);
      if (t === STEEL || t === WATER) continue;
      const j = nr * COLS + nc, nd = flow[i] + (t === BRICK ? 4 : t === FENCE ? 2 : 1);
      if (nd < flow[j]) { flow[j] = nd; q.push(j); }
    }
  }
}

// ---------- состояние игры ----------
let state = 'menu', player = null, enemies = [], bullets = [], parts = [], items = [], wrecks = [], rails = [];
let base = null;
let artilleryShells=[],itemSpawnTimer=10,barrageMarkers=[],barrageTrajectories=[],barrageSoundShots=0,barrageFrame=0;

let score = 0, scrap = 0, hitstop = 0, wave = 0, toSpawn = [], spawnTimer = 0, flowTimer = 0, betweenT = 0, deadT = 0, overT = 0;
let shake = 0, time = 0, banner = { text: '', sub: '', t: 0 };
let best = 0;
try { best = +localStorage.getItem('ecotank-best') || 0; } catch (e) {}

function waveList(w) {
  const n = CFG.waveBase + (w - 1) * CFG.wavePerLevel, list = [], pH = Math.min(.07 * w, .35);
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    list.push(r < pH ? 'heavy' : r < pH + .38 ? 'scout' : 'soldier');
    if((i+1)%5===0)list.push('artillery');
  }
  return list;
}
const maxAlive = () => Math.min(CFG.maxAliveBase + Math.floor(wave / 2), CFG.maxAliveCap);

function startGame() {
  applyMapChoice();score = 0; scrap = 0; wave = campaign ? CFG.campaignStart : 0; player = null; victory = false;
  base = { ...BASE_POS, hp: 5, maxHp: 5, dead: false };
  nextWave(); syncMusic();
}

function winCampaign() {
  victory = true; state = 'over'; overT = 0; banner.t = 0; CFG.campaignStart = 0; saveDev();
  if (score > best) { best = score; try { localStorage.setItem('ecotank-best', best); } catch (e) {} }
  sfx('wave');
}

function nextWave() {
  wave++;
  if (campaign) {
    if (wave > campaign.length) { wave = campaign.length; winCampaign(); return; }
    // размер поля может смениться между уровнями: база и старт переезжают вместе с ним
    activeMap = campaign[wave - 1];
    if (activeMap.cols !== COLS) { configureMap(activeMap.cols); if (base) { base.x = BASE_POS.x; base.y = BASE_POS.y; } }
  }
  genMap(wave);
  if(base) {
    const center=Math.floor(COLS/2);
    for(let r=ROWS-2;r<ROWS;r++)for(let c=center-1;c<=center+1;c++) {
      const i=r*COLS+c,wall=r===ROWS-2||c!==center;
      grid[i]=wall?BRICK:EMPTY;brickHp[i]=wall?4:0;brickMask[i]=wall?1023:0;
    }
  }
  const tier=player&&!player.dead?(player.upgrade||0):0;
  const maxHp=playerMaxHp(tier),hp=player?Math.min(maxHp,player.hp+CFG.waveHeal):maxHp;
  const rail = player ? player.rail : 0;
  const boostState=player?{boostLeft:player.boostLeft,boostCooldown:player.boostCooldown,shiftHeld:player.shiftHeld}:{};
  const armor = !!(player && !player.dead && player.armor);
  player = makeTank(PLAYER_START.x, PLAYER_START.y, 'player');
  setPlayerUpgrade(player,tier,false);player.hp = hp; player.rail = rail; player.armor=tier>0; Object.assign(player,boostState); player.cd = .3;
  enemies = []; bullets = []; items = []; parts = []; wrecks = []; rails = []; resetArtillery();itemSpawnTimer=10;
  toSpawn = waveList(wave); spawnTimer = 1.2; flowTimer = 0;
  banner = campaign
    ? { text: `${UI_TEXT.uroven}${wave}${UI_TEXT.iz}${campaign.length}`, sub: `${activeMap.name}${UI_TEXT.vragov}${toSpawn.length}`, t: 2.4 }
    : { text: `${UI_TEXT.volna}${wave}`, sub: `${UI_TEXT.vragov_2}${toSpawn.length}`, t: 2.2 };
  state = 'play';
  sfx('wave');
}

// ---------- ввод ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => {
  if (e.code === 'Escape' && devOpen) { devOpen = false; document.activeElement.blur(); return; }
  // в редакторе игра не слушает клавиатуру; Esc закрывает его только из списка, чтобы не потерять правки
  if (editorOpen) { if (e.code === 'Escape' && !edit) closeEditor(); return; }
  if (mapEdOpen) {
    if (e.code === 'Escape' && !mapEd) closeMapEditor();
    else if (mapEd && mapStamp && (e.code === 'KeyR' || e.code === 'KeyF') && !['INPUT', 'SELECT'].includes(e.target.tagName)) { turnStamp(e.code === 'KeyR' ? 'turn' : 'flip'); renderMapEditor(); }
    return;
  }
  if (['INPUT','SELECT'].includes(e.target.tagName)) return;
  if(state==='menu'&&devOpen)return;
  if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat&&player&&!player.dead&&state==='play')player.boostQueued=true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && (state === 'menu' || (state === 'over' && overT > .6))) startGame();
  else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; devOpen = false; }
  else if (e.code === 'KeyM') { muted = !muted; syncMusic(); }
  else if (e.code === 'KeyE' && (state === 'play' || state === 'between')) fireRail(player);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });
cv.addEventListener('mousemove', e => {
  const b = cv.getBoundingClientRect();
  mouse.x = (e.clientX - b.left) * W / b.width; mouse.y = (e.clientY - b.top) * H / b.height;
});
cv.addEventListener('mousedown', e => {
  if (e.button === 2 && (state === 'play' || state === 'between')) { fireRail(player); return; }
  if (e.button !== 0) return;
  mouse.down = true;
  if (state === 'menu' || (state === 'over' && overT > .6)) startGame();
  else if (state === 'pause' && !devOpen) state = 'play';
});
addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H) * .97;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// Видимость для ИИ (геометрия и движение танков — tanks.js).

function los(x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8);
  for (let i = 1; i < n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    if (bulletBlocked(x,y)) return false;
  }
  return true;
}

// ---------- эффекты ----------
function burst(x, y, n, colors, speed, life, size, kind) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(speed * .2, speed);
    const l = rnd(life * .5, life);
    const p = { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, size: rnd(size * .5, size), color: colors[ri(0, colors.length - 1)], kind };
    if (kind === 'debris') { p.rot = rnd(0, 6); p.vr = rnd(-12, 12); }
    parts.push(p);
  }
}

function explosion(x, y, big, color, sizeMultiplier=1) {
  const k = (big ? 1.4 : 1)*sizeMultiplier;
  parts.push({ x, y, vx: 0, vy: 0, life: .2, max: .2, size: 70 * k, kind: 'flash' });
  parts.push({ x, y, vx: 0, vy: 0, life: .45, max: .45, size: 80 * k, kind: 'ring' });
  burst(x, y, 50 * k, ['#fff3c0', '#ffe08a', '#ff9a3c', '#e8442c', '#ffcf5a'], 300 * k, .7, 9 * k, 'fire');
  burst(x, y, 26 * k, ['#fff', '#ffe9a0', '#ffb24a'], 560, .5, 2, 'spark');
  burst(x, y, 12 * k, [color || '#666', '#2a2a2a', '#4a4a4a'], 280, 1.1, 7, 'debris');
  burst(x, y, 22 * k, ['#2e2e2e', '#444', '#5a5a5a'], 90, 1.8, 13 * k, 'smoke');
  shake = Math.max(shake, big ? 20 : 13);
  hitstop = Math.max(hitstop, CFG.hitstop);
  gctx.fillStyle = 'rgba(20,15,10,.4)';
  gctx.beginPath(); gctx.arc(x, y, 24 * k, 0, Math.PI * 2); gctx.fill();
  gctx.fillStyle = 'rgba(20,15,10,.2)';
  for (let i = 0; i < 8; i++) {
    const a = rnd(0, 6), d = rnd(18, 36) * k;
    gctx.beginPath(); gctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rnd(4, 9), 0, Math.PI * 2); gctx.fill();
  }
  sfx('boom');
}
function floatText(x, y, text, color) {
  parts.push({ x, y, vx: 0, vy: -40, life: 1, max: 1, text, color });
}

// ---------- обновление ----------

function decide(e, random) {
  const K = KINDS[e.kind], c = Math.floor(e.x / T), r = Math.floor(e.y / T);
  const opts = [];
  for (const [dc, dr] of DIRS) {
    const nc = c + dc, nr = r + dr, t = tileAt(nc, nr);
    if (t === STEEL || t === WATER) continue;
    if (random && breakable(t) && e.kind!=='heavy') continue;
    opts.push({ nc, nr, t, v: flow[nr * COLS + nc] });
  }
  e.brick = null;
  if (!opts.length) { e.tx = c * T + 16; e.ty = r * T + 16; return; }
  let pick = opts.reduce((a, b) => b.v < a.v ? b : a);
  if (random || Math.random() < K.wander) pick = opts[ri(0, opts.length - 1)];
  if (breakable(pick.t)) {
    e.brick = { x: pick.nc * T + 16, y: pick.nr * T + 16 };
    e.tx = c * T + 16; e.ty = r * T + 16;
  } else {
    e.tx = pick.nc * T + 16; e.ty = pick.nr * T + 16;
  }
}

const enemyInterval=kind=>({scout:1/.33,soldier:2,heavy:5,artillery:6}[kind]);
function enemyGoal(e) {
  const choices=[player,base].filter(t=>t&&!t.dead);
  return choices.sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y))[0]||PLAYER_START;
}
function formColumns() {
  const rank={heavy:3,soldier:2,scout:1},eligible=enemies.filter(e=>!e.dead&&!e.entering&&!(e.detourTime>0));
  const pool=eligible.filter(e=>e.kind!=='artillery').sort((a,b)=>rank[b.kind]-rank[a.kind]),guns=eligible.filter(e=>e.kind==='artillery'&&!e.deployed);
  for(const e of eligible){e.leader=null;e.columnSlot=0;}
  while(pool.length){const lead=pool.shift(),gun=guns.find(e=>Math.hypot(e.x-lead.x,e.y-lead.y)<260);
    const near=pool.filter(e=>Math.hypot(e.x-lead.x,e.y-lead.y)<220).sort((a,b)=>Math.hypot(a.x-lead.x,a.y-lead.y)-Math.hypot(b.x-lead.x,b.y-lead.y)).slice(0,gun?1:2);
    near.forEach((e,i)=>{e.leader=lead;e.columnSlot=i+1;pool.splice(pool.indexOf(e),1);});
    if(gun){gun.leader=lead;gun.columnSlot=near.length+1;guns.splice(guns.indexOf(gun),1);}
  }
}

function coverClear(x,y,r) {
  return [[0,0],[-r,-r],[r,-r],[-r,r],[r,r]].every(([dx,dy])=>!blocksTank(tileAt(Math.floor((x+dx)/T),Math.floor((y+dy)/T))));
}
function updateCover(e,goal,dt) {
  e.coverSearch=(e.coverSearch||0)-dt;
  if(e.cover && (Math.hypot(goal.x-e.cover.gx,goal.y-e.cover.gy)>96 || e.stuck>.6))e.cover=null;
  if(!e.cover && e.coverSearch<=0 && !e.leader) {
    e.coverSearch=1.5;
    const c=Math.floor(e.x/T),r=Math.floor(e.y/T);
    outer:for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++) {
      const x=(c+dc)*T+16,y=(r+dr)*T+16;
      if(!coverClear(x,y,e.r)||los(x,y,goal.x,goal.y)||Math.hypot(x-e.x,y-e.y)>100)continue;
      for(const [dx,dy] of DIRS) {
        const px=x+dx*64,py=y+dy*64;
        if(!coverClear(px,py,e.r)||!coverClear((x+px)/2,(y+py)/2,e.r)||!los(px,py,goal.x,goal.y))continue;
        e.cover={x,y,px,py,gx:goal.x,gy:goal.y};e.retreat=false;break outer;
      }
    }
  }
  if(e.cover) {
    const q=e.cover;
    if(e.retreat&&Math.hypot(e.x-q.x,e.y-q.y)<5&&e.cd<.5)e.retreat=false;
    e.tx=e.retreat?q.x:q.px;e.ty=e.retreat?q.y:q.py;e.brick=null;
  }
}
function blockingBrick(e,goal) {
  const n=Math.ceil(Math.hypot(goal.x-e.x,goal.y-e.y)/6);
  for(let j=1;j<n;j++) {const x=e.x+(goal.x-e.x)*j/n,y=e.y+(goal.y-e.y)*j/n,c=Math.floor(x/T),r=Math.floor(y/T),t=tileAt(c,r);
    if(t===STEEL||t===WATER)return null;if(breakable(t)&&bulletBlocked(x,y))return {x,y};}
  return null;
}
function reconsiderRoute(e,dt) {
  if(e.watchX===undefined){e.watchX=e.x;e.watchY=e.y;e.idleTime=0;}
  if(Math.hypot(e.x-e.watchX,e.y-e.watchY)>6){e.watchX=e.x;e.watchY=e.y;e.idleTime=0;}
  else e.idleTime+=dt;
  e.detourTime=Math.max(0,(e.detourTime||0)-dt);
  if(e.idleTime>=5) {
    e.idleTime=0;e.watchX=e.x;e.watchY=e.y;e.cover=null;e.retreat=false;e.leader=null;e.stuck=0;
    const goal=enemyGoal(e);buildFlow(Math.floor(goal.x/T),Math.floor(goal.y/T));
    const c=Math.floor(e.x/T),r=Math.floor(e.y/T),options=DIRS.map(([dx,dy])=>({x:(c+dx)*T+16,y:(r+dy)*T+16})).filter(q=>coverClear(q.x,q.y,e.r));
    if(options.length){const q=options[ri(0,options.length-1)];e.tx=q.x;e.ty=q.y;e.brick=null;e.detourTime=1.5;e.decideT=1.5;}
    else {decide(e,false);e.detourTime=1.5;}
    e.repaths=(e.repaths||0)+1;
  }
}
function updateEnemy(e, dt) {
  const K = KINDS[e.kind];
  e.flash -= dt; e.recoil = (e.recoilMax||5)*clamp(e.cd/enemyInterval(e.kind),0,1);
  if (e.spawnT > 0) { e.spawnT -= dt; return; }
  if(e.entering) {e.y+=K.speed*dt;e.ty=e.y;e.tx=e.x;if(e.y>=48){e.y=48;e.entering=false;e.cd=enemyInterval(e.kind);}return;}
  e.cd -= dt; e.decideT -= dt;reconsiderRoute(e,dt);
  if(e.kind==='artillery'){updateArtillery(e,dt);return;}
  const goal=enemyGoal(e);
  if(!e.leader)buildFlow(Math.floor(goal.x/T),Math.floor(goal.y/T));

  const p = player, alive = p && !p.dead;
  const dp = alive ? Math.hypot(p.x - e.x, p.y - e.y) : 1e9;
  const hidden = alive && tileAt(Math.floor(p.x / T), Math.floor(p.y / T)) === TREE && dp > CFG.treeStealth;
  const sees = alive && !hidden && dp < CFG.enemySight && los(e.x, e.y, p.x, p.y);
  e.engaged=sees;

  // движение от клетки к клетке по полю расстояний
  if (e.stuck > .7) { e.stuck = 0; decide(e, true); e.decideT = .5; }
  else if (Math.hypot(e.tx - e.x, e.ty - e.y) < 1.5 && e.decideT <= 0) { decide(e, false); e.decideT = e.brick ? .35 : 0; }

  if(e.detourTime<=0 && e.leader && !e.leader.dead && !e.brick) {
    const lead=e.leader, gap=48*e.columnSlot;
    const gx=lead.x-Math.cos(lead.angle)*gap,gy=lead.y-Math.sin(lead.angle)*gap;
    if(los(e.x,e.y,gx,gy)) {e.tx=clamp(gx,24,W-24);e.ty=clamp(gy,24,H-24);}
  }
  const pathWall=blockingBrick(e,goal);
  if(pathWall && (e.kind==='heavy'||e.stuck>.25||e.brick)) {e.brick=pathWall;e.cover=null;e.retreat=false;}
  else if(e.detourTime<=0)updateCover(e,goal,dt);
  const hold = e.detourTime<=0 && !e.cover && sees && dp < K.hold;
  const mx = e.tx - e.x, my = e.ty - e.y, md = Math.hypot(mx, my);
  if (!hold && md > .5) {
    const speed = K.speed * (1 + Math.min(wave, 10) * CFG.enemySpeedPerWave);
    const step = Math.min(md, speed * dt);
    e.angle = turnTo(e.angle, Math.atan2(my, mx), dt * 8);
    const moved = moveTank(e, mx / md * step, my / md * step, dt);
    if (step > .5 && moved < step * .3) e.stuck += dt; else e.stuck = Math.max(0, e.stuck - dt);
  }

  // башня и стрельба
  let target = null;
  if(e.brick)target=e.brick;
  else if (sees && goal===p) {
    const lead = dp / (e.kind==='heavy'?3000:K.bulletSpeed) * .6;
    target = { x: p.x + p.vx * lead, y: p.y + p.vy * lead };
  } else if(base && !base.dead && los(e.x,e.y,base.x,base.y)) target=base;
  else if (e.brick) target = e.brick;
  const aim = target ? Math.atan2(target.y - e.y, target.x - e.x) : e.angle;
  e.turret = turnTo(e.turret, aim, dt * K.turretSpeed);
  if (target && !e.retreat && e.cd <= 0 && Math.abs(angDiff(e.turret, aim)) < .12) {
    fire(e);
    e.cd = enemyInterval(e.kind);
    if(e.cover) e.retreat=true;
  }
}

function drawBase() {
  if(!base)return;
  ctx.save();ctx.translate(base.x,base.y);
  ctx.fillStyle=base.dead?'#38332c':'#a52e25';ctx.fillRect(-16,-16,32,32);
  ctx.strokeStyle='#e5b75d';ctx.lineWidth=2;ctx.strokeRect(-15,-15,30,30);
  if(!base.dead) {
    ctx.save();ctx.scale(.058,.058);ctx.translate(-220,-220);ctx.fillStyle='#ffdc65';
    ctx.beginPath();ctx.moveTo(155,54);ctx.bezierCurveTo(320,20,460,172,383,306);ctx.bezierCurveTo(312,423,154,413,95,328);ctx.lineTo(114,302);ctx.bezierCurveTo(193,378,300,355,345,264);ctx.bezierCurveTo(395,158,274,55,155,54);ctx.fill();
    ctx.beginPath();ctx.moveTo(167,98);ctx.lineTo(230,101);ctx.lineTo(244,116);ctx.lineTo(198,162);ctx.lineTo(396,363);ctx.quadraticCurveTo(406,378,391,391);ctx.quadraticCurveTo(377,405,362,391);ctx.lineTo(174,190);ctx.lineTo(128,226);ctx.lineTo(79,180);ctx.closePath();ctx.fill();
    ctx.lineWidth=35;ctx.lineCap='round';ctx.strokeStyle='#ffdc65';ctx.beginPath();ctx.moveTo(113,304);ctx.lineTo(59,371);ctx.stroke();ctx.restore();
  } else {ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(10,12);ctx.moveTo(11,-11);ctx.lineTo(-9,10);ctx.stroke();}
  for(let i=0;i<5;i++){ctx.fillStyle=i<base.hp?'#ffcf60':'#382e28';ctx.fillRect(-15+i*6,-23,5,4);}
  ctx.restore();
}

function updateSpawns(dt) {
  spawnTimer -= dt;
  if (!toSpawn.length || spawnTimer > 0 || enemies.length >= maxAlive()) return;
  const free = SPAWNS.filter(s => {
    const x = s.c * T + 16, y = s.r * T + 16;
    return !enemies.concat(player && !player.dead ? [player] : []).some(t => Math.hypot(t.x - x, t.y - y) < 40);
  });
  if (!free.length) return;
  const s = free[ri(0, free.length - 1)];
  const e = makeTank(s.c * T + 16, -32, toSpawn.pop());
  e.angle = e.turret = Math.PI / 2; e.spawnT = 0; e.entering=true;
  enemies.push(e);
  spawnTimer = rnd(1.2, 2.4);
}

function updateParts(dt) {
  for(let i=0;i<brickShake.length;i++)brickShake[i]=Math.max(0,brickShake[i]-dt);
  for(let i=0;i<foliageShake.length;i++)foliageShake[i]=Math.max(0,foliageShake[i]-dt);
  const DRAG = { smoke: .3, spark: .15, debris: .08 };
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    const drag = p.text ? 1 : Math.pow(DRAG[p.kind] || .05, dt);
    p.vx *= drag; p.vy *= drag;
    if (p.kind === 'smoke') p.vy -= 25 * dt;
    if (p.kind === 'debris') p.rot += p.vr * dt;
    p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of rails) r.life -= dt;
  rails = rails.filter(r => r.life > 0);
}

function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'pause') return;
  updateBaseCollapse(dt);
  if (hitstop > 0) { hitstop -= dt; return; }
  updateParts(dt);
  shake = Math.max(0, shake - dt * 30);
  banner.t -= dt;
  if (state === 'over') { overT += dt; return; }

  if (player) {
    player.flash -= dt;
    flowTimer -= dt;
    if (flowTimer <= 0 && !player.dead) {
      const goal=base && !base.dead ? base : player;
      buildFlow(clamp(Math.floor(goal.x / T), 0, COLS - 1), clamp(Math.floor(goal.y / T), 0, ROWS - 1));
      flowTimer = .4;
    }
  }
  updatePlayer(dt); updateTreadSound(dt);
  updateArtilleryShells(dt);updateRandomItems(dt);
  if (state === 'play') updateSpawns(dt);
  formColumns();
  for (const e of enemies) updateEnemy(e, dt);
  enemies = enemies.filter(e => !e.dead);
  separate();
  updateBullets(dt);
  enemies = enemies.filter(e => !e.dead);
  updateItems(dt);
  updateWrecks(dt);

  if (player.dead || (base && base.dead)) {
    deadT -= dt;
    if (deadT <= 0 && !(base&&base.dead&&base.collapseCount<3)) {
      state = 'over'; overT = 0;
      if (score > best) { best = score; try { localStorage.setItem('ecotank-best', best); } catch (e) {} }
      // повтор кампании начинается с проигранного уровня
      if (campaign) { CFG.campaignStart = wave - 1; saveDev(); }
    }
  } else if (state === 'play' && !player.upgradeT && !toSpawn.length && !enemies.length && !wrecks.some(w=>w.exploded===false)&&!artilleryShells.length&&!hasPendingBarrage()) {
    const bonus = CFG.waveBonus * wave;
    score += bonus;
    const collected=collectRemainingScrap();
    if (campaign) unlockCampaign(Math.min(wave + 1, campaign.length));
    banner = { text: campaign ? (wave >= campaign.length ? UI_TEXT.posledniy_uroven_proyden : UI_TEXT.uroven_proyden) : UI_TEXT.volna_proydena, sub: `${UI_TEXT.bonus}${bonus}${UI_TEXT.metallolom_2}${collected}`, t: 2.5 };
    state = 'between'; betweenT = 2.8;
    sfx('wave');
  } else if (state === 'between') {
    betweenT -= dt;
    if (betweenT <= 0) nextWave();
  }
}

// ---------- отрисовка ----------
function tileHash(c, r) { let h = (c * 73856093) ^ (r * 19349663); h = (h ^ (h >>> 13)) * 1274126177; return (h >>> 0) / 4294967296; }

function drawTiles() {
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r * COLS + c];
    if (t === STEEL) ctx.fillRect(c * T + 4, r * T + 4, T, T);
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = grid[r * COLS + c], x = c * T, y = r * T;
    if (t === BRICK) drawBrick(x, y, brickHp[r * COLS + c], brickMask[r * COLS + c], brickVariant[r * COLS + c]);
    else if (t === FENCE) drawFence(c, r);
    else if (t === STEEL) drawSteel(x, y);
    else if (t === WATER) drawWater(x, y, c, r);
  }
}

function drawBrick(x,y,hp,mask,variant) {
  const i=Math.floor(y/T)*COLS+Math.floor(x/T),jolt=brickShake[i]*5;
  ctx.save();ctx.translate(Math.sin(time*65+i)*jolt,Math.cos(time*59+i)*jolt*.5);
  masonry(0).forEach((b,q)=>{
    if(!(mask & (1<<q)))return;
    ctx.fillStyle='#402b21';ctx.fillRect(x+b.x,y+b.y,b.w,8);
    ctx.fillStyle=['#b3633a','#a95833','#bd7149'][Math.abs(Math.floor((x+b.x+(b.y%16?8:0))/16)+Math.floor((y+b.y)/8))%3];
    ctx.fillRect(x+b.x,y+b.y+1,b.w,7);
    if(b.x>0 || b.y%16===0){ctx.fillStyle='#402b21';ctx.fillRect(x+b.x,y+b.y,1,8);}
    ctx.fillStyle='#d18b6066';ctx.fillRect(x+b.x+1,y+b.y+1,b.w-2,1);
    if(hp<4){ctx.strokeStyle='#502c23';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+b.x+b.w*.3,y+b.y+1);ctx.lineTo(x+b.x+b.w*.6,y+b.y+4);ctx.lineTo(x+b.x+b.w*.5,y+b.y+7);ctx.stroke();}
  });
  ctx.restore();
}

// вид сверху: доска-перекладина по каждому плечу, столбы в центре и на краях клетки
function drawFence(c, r) {
  const rects = fenceRects(c, r), x = c * T, y = r * T, arms = fenceArms[r * COLS + c];
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (const b of rects) ctx.fillRect(b.x + 2, b.y + 3, b.w, b.h);
  for (const b of rects) {
    ctx.fillStyle = '#5a3d22'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#a57a46'; ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#c49a62'; b.w > b.h ? ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 1) : ctx.fillRect(b.x + 1, b.y + 1, 1, b.h - 2);
  }
  const posts = [[16, 16]];
  if (arms & ARM_N) posts.push([16, 3]); if (arms & ARM_S) posts.push([16, 29]);
  if (arms & ARM_E) posts.push([29, 16]); if (arms & ARM_W) posts.push([3, 16]);
  for (const [px, py] of posts) {
    ctx.fillStyle = '#3f2a17'; ctx.fillRect(x + px - 4, y + py - 4, 8, 8);
    ctx.fillStyle = '#7a5531'; ctx.fillRect(x + px - 3, y + py - 3, 6, 6);
    ctx.fillStyle = '#5a3d22'; ctx.fillRect(x + px - 1, y + py - 1, 2, 2);
  }
}

function drawSteel(x, y) {
  ctx.fillStyle = '#6f7b85'; ctx.fillRect(x, y, T, T);
  ctx.fillStyle = '#9aa6af'; ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
  ctx.fillStyle = '#b9c3ca'; ctx.fillRect(x + 3, y + 3, T - 6, 3);
  ctx.fillStyle = '#5b666f';
  for (const [ox, oy] of [[7, 7], [25, 7], [7, 25], [25, 25]]) { ctx.beginPath(); ctx.arc(x + ox, y + oy, 2, 0, Math.PI * 2); ctx.fill(); }
}

function drawWater(x, y, c, r) {
  ctx.fillStyle = '#2c6d96'; ctx.fillRect(x, y, T, T);
  ctx.strokeStyle = 'rgba(190,230,255,.35)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 2; k++) {
    const yy = y + 8 + k * 16 + Math.sin(time * 2 + k) * 2;
    ctx.beginPath();
    for (let xx = 0; xx <= T; xx += 4) ctx.lineTo(x + xx, yy + Math.sin((x + xx) * .25 + time * 3) * 1.5);
    ctx.stroke();
  }
}

function drawTrees() {
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) {
    const i=r*COLS+c;if(grid[i]!==TREE)continue;
    const x=c*T+16,y=r*T+16,shake=foliageShake[i]*7;
    const sway=Math.sin(time*1.5+tileHash(c,r)*10)+Math.sin(time*42+i)*shake;
    LEAF_BLOBS.forEach(([ox,oy,rr],q)=>{

function boostProgress(p){return p.boostLeft>0?clamp(p.boostLeft/2,0,1):clamp(1-(p.boostCooldown||0)/10,0,1);}

  ctx.beginPath();ctx.moveTo(-9,-17);ctx.lineTo(9,-17);ctx.lineTo(13,-7);ctx.lineTo(12,16);ctx.lineTo(-12,16);ctx.lineTo(-13,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle=light;ctx.fillRect(-12,-16,4,28);ctx.fillRect(8,-16,4,28);

  if(isP&&t.upgrade>0){ctx.fillStyle='#c3c994';ctx.fillRect(-7,-13,14,3);ctx.fillStyle='#354321';ctx.fillRect(-9,6,18,8);}

function drawTank(t) {
  const K = KINDS[t.kind], s = tankScale(t);
  ctx.save();
  if(t.spawnT>0)ctx.globalAlpha=clamp(1-t.spawnT,0,1);
  if(t===player && t.inv>0 && Math.floor(time*20)%2)ctx.globalAlpha=.45;
  if(t===player&&t.upgradeT>0){
    const progress=clamp(1-t.upgradeT/UPGRADE_DURATION,0,1),a=ctx.globalAlpha;
    ctx.globalAlpha=a*(1-progress);drawPlayerModel({...t,upgrade:t.upgradeFrom});
    ctx.globalAlpha=a*progress;drawPlayerModel(t);ctx.globalAlpha=a;
    ctx.strokeStyle='#ffe49b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,t.r+8+Math.sin(time*9)*3,0,Math.PI*2);ctx.stroke();

  }else drawPlayerModel(t);ctx.restore();
  if((t===player||t.kind==='soldier'||t.kind==='heavy') && t.hp<t.maxHp && t.spawnT<=0) {
    ctx.fillStyle='#282323aa';ctx.beginPath();ctx.ellipse(t.x-6,t.y-12,6,11,0,0,Math.PI*2);ctx.fill();
    drawFlames(t.x-6,t.y+2,t.hp/t.maxHp<=.5?1:.65);
  }
  if(t===player) {
    const progress=boostProgress(t),y=t.y+t.r+7;
    ctx.fillStyle='#0b151be0';ctx.fillRect(t.x-11,y,22,4);
    ctx.fillStyle=t.boostLeft>0?'#7cd6ed':progress>=1?'#a6e67a':'#f1c56b';ctx.fillRect(t.x-10,y+1,20*progress,2);
  }
  if (t === player && t.pw.shield > 0) {
    const a = t.pw.shield < 2 && Math.floor(time * 8) % 2 ? .15 : .5;
    ctx.strokeStyle = `rgba(140,240,160,${a})`; ctx.lineWidth = 3;

function drawItems() {
  for (const it of items) {

}

function drawWrecks() {

function drawRails() {

function drawParts() {

    if (overT > .3) {
      text(victory ? UI_TEXT.kampaniya_proydena : base && base.dead ? UI_TEXT.baza_unichtozhena : UI_TEXT.tank_unichtozhen, UI_W / 2, UI_H / 2 - 70, 52, victory ? '#f0cc77' : '#ef6452', 'center', '800');
      text(`${UI_TEXT.ochki_2}${score}   ·   ${campaign ? UI_TEXT.uroven_2 : UI_TEXT.volna_2}: ${campaign ? `${wave}${UI_TEXT.iz}${campaign.length}` : wave}${UI_TEXT.metallolom_4}${scrap}`, UI_W / 2, UI_H / 2 - 10, 22, '#fff', 'center');
      text(score >= best && score > 0 ? UI_TEXT.novyy_rekord : `${UI_TEXT.rekord}${best}`, UI_W / 2, UI_H / 2 + 25, 18, '#ffe08a', 'center');
      const again = !campaign ? UI_TEXT.enter_ili_klik_eshchyo_raz : victory ? UI_TEXT.enter_ili_klik_proyti_kampaniyu_zanovo : `${UI_TEXT.enter_ili_klik_povtorit_uroven}${wave}`;
      if (overT > .6 && Math.floor(time * 2) % 2 === 0) text(again, UI_W / 2, UI_H / 2 + 80, 18, '#f2d3b1', 'center', '400');
    }
  }
}

// ---------- настройки разработчика ----------

const DEV_DEFAULTS = JSON.stringify({ KINDS, CFG, balanceVersion:2,artilleryVersion:2 });
let devOpen = false;
const pauseMenu = document.getElementById('pauseMenu'), devEl = document.getElementById('dev'), devBody = document.getElementById('devBody');

function applyDev(s) {
  for (const k in s.KINDS) if (KINDS[k]) {
    const { scale, ...settings } = s.KINDS[k];
    if(k==='player'&&!(s.balanceVersion>=2))delete settings.hp;
    if(k==='artillery'&&!(s.artilleryVersion>=2)){settings.bulletSpeed=(Number(settings.bulletSpeed)||140)*1.3;settings.dmg=2;}
    Object.assign(KINDS[k], settings);
  }
  Object.assign(CFG, s.CFG);
}
function saveDev() { try { localStorage.setItem('ecotank-dev-v2', JSON.stringify({ KINDS, CFG, balanceVersion:2,artilleryVersion:2 })); } catch (e) {} }
try { const s = JSON.parse(localStorage.getItem('ecotank-dev-v2')); if (s) applyDev(s); } catch (e) {}

function numInput(obj, key, min, max, step, value) {
  return `<input type="number" data-obj="${obj}" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${value}">`;
}
function buildDev() {
  const kinds = Object.keys(KINDS);
  let h = ("<h3>" + UI_TEXT.tanki + "</h3><table><tr><th></th>") + kinds.map(k => `<th style="color:${KINDS[k].color}">${KIND_NAMES[k]}</th>`).join('') + '</tr>';
  for (const [key, label, min, max, step] of TANK_FIELDS) {
    h += `<tr><td>${label}</td>` + kinds.map(k => key in KINDS[k] ? `<td>${numInput(k, key, min, max, step, KINDS[k][key])}</td>` : '<td class="na">—</td>').join('') + '</tr>';
  }
  h += '</table>';
  for (const [title, fields] of CFG_FIELDS) {
    h += `<h3>${title}</h3><div class="grid">`;
    for (const [key, label, min, max, step] of fields) {
      h += `<label>${label}` + (min === 'bool'
        ? `<input type="checkbox" data-obj="CFG" data-key="${key}"${CFG[key] ? ' checked' : ''}>`
        : numInput('CFG', key, min, max, step, CFG[key])) + '</label>';
    }
    h += '</div>';
  }
  devBody.innerHTML = h;
}
devBody.addEventListener('input', e => {
  const el = e.target, k = el.dataset.obj, obj = k === 'CFG' ? CFG : KINDS[k];
  if (!obj) return;
  if (el.type === 'checkbox') obj[el.dataset.key] = el.checked;
  else {
    const v = parseFloat(el.value);
    if (isNaN(v)) return;
    obj[el.dataset.key] = clamp(v, +el.min, +el.max);
  }
  if(player&&k==='player'&&el.dataset.key==='hp')setPlayerUpgrade(player,player.upgrade||0,false);
  saveDev();
});
devEl.querySelector('.devActions').addEventListener('click', e => {
  const act = e.target.dataset.act;
  if (!act) return;
  const alive = player && !player.dead;
  if (act === 'heal' && alive) player.hp = player.maxHp;
  else if (act === 'rail' && alive) player.rail = Math.min(CFG.railMax, player.rail + 1);
  else if (act === 'powerups' && alive) {for (const k in player.pw) player.pw[k] = CFG.powerupTime;setPlayerUpgrade(player,2);}
  else if (act === 'kill') { for (const e of enemies) if (e.spawnT <= 0) hitEnemy(e, { x: e.x, y: e.y, dmg: 999 }); enemies = enemies.filter(e => !e.dead); }
  else if (act === 'skip' && alive) { nextWave(); state = 'pause'; }
  else if (act === 'reset') {
    applyDev(JSON.parse(DEV_DEFAULTS));
    try { localStorage.removeItem('ecotank-dev-v2'); } catch (e) {}
    if(player)setPlayerUpgrade(player,player.upgrade||0,false);
    buildDev();
  }
});
document.getElementById('btnResume').addEventListener('click', e => { e.currentTarget.blur(); state = 'play'; });
document.getElementById('btnNewGame').addEventListener('click', e => {
  e.currentTarget.blur(); devOpen = false;
  if (score > best) { best = score; try { localStorage.setItem('ecotank-best', best); } catch (err) {} }
  toMenu();
});
// ---------- подключение редакторов ----------
initPresetEditor();
initMapEditor();

// список уровней кампании: закрытые уровни видны, но недоступны для старта
let campaignPickKey = '';
function renderCampaignPick() {
  const levels = campaignMaps(), open = campaignUnlocked(), key = levels.map(m => m.id).join() + ':' + open;
  if (key === campaignPickKey) return;
  campaignPickKey = key;
  document.getElementById('campaignPick').innerHTML = levels.length
    ? levels.map((m, i) => `<option value="${i}"${i >= open ? ' disabled' : ''}>${i >= open ? '🔒 ' : ''}${UI_TEXT.uroven}${i + 1} · ${escapeHtml(m.name)} · ${m.cols}×${m.rows.length}</option>`).join('')
    : ("<option value=\"0\">" + UI_TEXT.net_kart_kampanii + "</option>");
}
document.getElementById('campaignPick').addEventListener('change', e => {
  CFG.campaignStart = +e.target.value || 0; saveDev(); e.target.blur();
  if (state === 'menu') toMenu();
});
document.getElementById('mapPick').addEventListener('change', e => {
  CFG.mapPick = e.target.value; saveDev(); e.target.blur();
  if (state === 'menu') toMenu();
});

// стартовый экран: фон-превью собирается из выбранных размера и режима карты
function toMenu() {
  resetArtillery();itemSpawnTimer=10;state = 'menu'; player = null; base = null; enemies = []; bullets = []; items = []; parts = []; wrecks = []; rails = []; banner.t = 0;
  applyMapChoice(); genMap(1);
}
document.getElementById('btnDev').addEventListener('click', e => { e.currentTarget.blur(); devOpen = true; buildDev(); });
document.getElementById('btnDevClose').addEventListener('click', e => { e.currentTarget.blur(); devOpen = false; });

document.getElementById('mapSize').value=String(CFG.mapSize||30);
document.getElementById('mapSize').addEventListener('change', e=>{
  CFG.mapSize=[30,45,60].includes(Number(e.target.value))?Number(e.target.value):30;saveDev();e.target.blur();
  if(state==='menu')toMenu();
});
document.getElementById('mapMode').addEventListener('change', e=>{
  CFG.mapMode=['preset01','map','campaign'].includes(e.target.value)?e.target.value:'original';saveDev();e.target.blur();
  if(state==='menu')toMenu();
});
function syncUI() {
  const mapPick=document.getElementById('mapPick'),campaignPick=document.getElementById('campaignPick');
  const fixed=CFG.mapMode==='map',camp=CFG.mapMode==='campaign';
  document.getElementById('mapSize').value=String(CFG.mapSize||30);
  document.getElementById('mapSize').hidden=fixed||camp;
  document.getElementById('mapMode').value=['preset01','map','campaign'].includes(CFG.mapMode)?CFG.mapMode:'original';
  if(mapPick.hidden===fixed)mapPick.hidden=!fixed;
  if(fixed&&mapPick.value!==CFG.mapPick)mapPick.value=CFG.mapPick;
  if(campaignPick.hidden===camp)campaignPick.hidden=!camp;
  if(camp){renderCampaignPick();if(campaignPick.value!==String(CFG.campaignStart))campaignPick.value=String(CFG.campaignStart);}
  document.getElementById('mapControl').hidden=editorOpen||mapEdOpen||state!=='menu';
  document.getElementById('mainMenu').hidden=state!=='menu'||editorOpen||mapEdOpen;
  document.getElementById('menuHome').hidden=state==='menu'||editorOpen||mapEdOpen;
  for(const mode of ['original','preset01','map','campaign'])document.getElementById('mode-'+mode).classList.toggle('selected',CFG.mapMode===mode);
  if (editorEl.hidden === editorOpen) editorEl.hidden = !editorOpen;
  if (mapEditorEl.hidden === mapEdOpen) mapEditorEl.hidden = !mapEdOpen;
  syncMusic();
  const pm = state === 'pause' && !devOpen, dv = (state === 'pause'||state==='menu') && devOpen;
  if (pauseMenu.hidden === pm) pauseMenu.hidden = !pm;
  if (devEl.hidden === dv) devEl.hidden = !dv;
}

function updateArtillery(e,dt){
  const alive=player&&!player.dead,range=20*T,playerInRange=alive&&Math.hypot(player.x-e.x,player.y-e.y)<=range;
  const baseInRange=base&&!base.dead&&Math.hypot(base.x-e.x,base.y-e.y)<=range;
  if(!e.deployed&&(playerInRange||(e.leader&&e.leader.engaged)||(base&&Math.hypot(base.x-e.x,base.y-e.y)<4*T)||(!e.leader&&baseInRange)))e.deployed=true;
  const goal=alive?player:base&&!base.dead?base:PLAYER_START;
  if(!e.deployed||(!playerInRange&&!baseInRange)){
    if(e.leader&&!e.leader.dead){e.tx=e.leader.x-Math.cos(e.leader.angle)*48*e.columnSlot;e.ty=e.leader.y-Math.sin(e.leader.angle)*48*e.columnSlot;}
    else {buildFlow(Math.floor(goal.x/T),Math.floor(goal.y/T));if(Math.hypot(e.tx-e.x,e.ty-e.y)<5||e.stuck>.6){decide(e,false);e.stuck=0;}}
    const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),step=Math.min(d,KINDS.artillery.speed*dt);
    if(d>1){e.angle=turnTo(e.angle,Math.atan2(dy,dx),dt*2);const moved=moveTank(e,dx/d*step,dy/d*step,dt);if(moved<step*.3)e.stuck+=dt;}
  }else {e.vx=e.vy=0;const target=playerInRange?player:base;
    const aim=Math.atan2(target.y-e.y,target.x-e.x);e.turret=turnTo(e.turret,aim,dt*KINDS.artillery.turretSpeed);
    if(e.cd<=0&&Math.abs(angDiff(e.turret,aim))<.15){launchArtillery(e.x,e.y,target.x,target.y);e.cd=enemyInterval('artillery');e.recoilMax=e.recoil=8;}
  }
}

function drawArtilleryShells(){
  for(const shell of artilleryShells){
    const pulse=.5+.5*Math.sin(time*7),p=clamp((shell.age-shell.delay)/shell.duration,0,1);
    ctx.save();ctx.fillStyle=`rgba(255,208,45,${.07+pulse*.1})`;ctx.strokeStyle=`rgba(255,218,65,${.5+pulse*.5})`;ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(shell.tx,shell.ty,shell.radius,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(shell.tx-8,shell.ty);ctx.lineTo(shell.tx+8,shell.ty);ctx.moveTo(shell.tx,shell.ty-8);ctx.lineTo(shell.tx,shell.ty+8);ctx.stroke();
    if(shell.pending||shell.age<shell.delay){ctx.restore();continue;}
    const x=shell.sx+shell.dx*p,y=shell.sy+shell.dy*p-Math.sin(p*Math.PI)*65;
    ctx.fillStyle='rgba(235,45,35,0.2)';ctx.beginPath();ctx.arc(x,y,10+pulse*5,0,Math.PI*2);ctx.fill();
    ctx.translate(x,y);ctx.rotate(shell.angle);ctx.fillStyle='#d8b5a1';
    ctx.beginPath();ctx.moveTo(6,0);ctx.quadraticCurveTo(2,-3,-5.5,-3);ctx.lineTo(-5.5,3);ctx.quadraticCurveTo(2,3,6,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#645543';ctx.fillRect(-5.5,-3,2,6);ctx.strokeStyle='#fff3c3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3,-1.2);ctx.lineTo(2.5,-.75);ctx.stroke();ctx.restore();
  }
}
function drawArtilleryModel(t){
  ctx.save();ctx.translate(t.x,t.y);ctx.scale(tankScale(t),tankScale(t));ctx.rotate(t.angle+Math.PI/2);
  ctx.fillStyle='#171c1c';ctx.fillRect(-16,-19,32,40);ctx.fillStyle='#62676a';for(let y=-18;y<20;y+=5){ctx.fillRect(-16,y,5,2);ctx.fillRect(11,y,5,2);}
  ctx.fillStyle=t.flash>0?'#fff':'#d5be7d';ctx.fillRect(-11,-18,22,35);
  if(!(t.flash>0)){ctx.fillStyle='#566048';ctx.beginPath();ctx.moveTo(-11,-15);ctx.lineTo(-3,-18);ctx.lineTo(4,-9);ctx.lineTo(1,2);ctx.lineTo(-11,5);ctx.closePath();ctx.fill();ctx.fillStyle='#944b36';ctx.beginPath();ctx.moveTo(4,-18);ctx.lineTo(11,-18);ctx.lineTo(11,-3);ctx.lineTo(6,2);ctx.lineTo(2,-7);ctx.closePath();ctx.fill();ctx.fillStyle='#944b36';ctx.fillRect(-10,11,8,7);}
  ctx.fillStyle='#e7d49e';ctx.fillRect(-12,-18,24,3);
  // Open rear fighting compartment and exposed breech distinguish the Hummel-inspired silhouette.
  ctx.fillStyle='#3f3b30';ctx.fillRect(-9,-4,18,22);ctx.strokeStyle='#d0bc88';ctx.lineWidth=3;ctx.strokeRect(-10,-5,20,24);
  ctx.strokeStyle='#566048';ctx.beginPath();ctx.moveTo(-10,-3);ctx.lineTo(-10,7);ctx.moveTo(10,11);ctx.lineTo(10,18);ctx.stroke();ctx.strokeStyle='#944b36';ctx.beginPath();ctx.moveTo(-6,19);ctx.lineTo(3,19);ctx.moveTo(10,-3);ctx.lineTo(10,5);ctx.stroke();
  ctx.fillStyle='#77715a';ctx.fillRect(-4,-3,8,16);ctx.fillStyle='#dad3ac';ctx.fillRect(-8,10,3,6);ctx.fillRect(6,8,3,7);ctx.restore();
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.turret+Math.PI/2);const recoil=recoilOffset(t);ctx.fillStyle='#302f2b';ctx.fillRect(-4,-35+recoil,8,35);ctx.fillStyle='#d5be7d';ctx.fillRect(-2,-34+recoil,4,31);ctx.fillStyle='#566048';ctx.fillRect(-2,-29+recoil,4,7);ctx.fillStyle='#944b36';ctx.fillRect(-2,-18+recoil,4,5);ctx.fillStyle='#877a53';ctx.fillRect(-6,-5,12,10);ctx.restore();
}

document.getElementById('menuStart').addEventListener('click',()=>startGame());
document.getElementById('menuSettings').addEventListener('click',()=>{devOpen=true;buildDev();});
document.getElementById('menuHome').addEventListener('click',()=>{devOpen=false;toMenu();syncMusic();});
for(const mode of ['original','preset01','map','campaign'])document.getElementById('mode-'+mode).addEventListener('click',()=>{CFG.mapMode=mode;saveDev();toMenu();});

// ---------- запуск ----------
renderMapPick();
toMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  syncUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
