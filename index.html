<style>
  html, body { margin: 0; height: 100%; background: #14181c; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; box-shadow: 0 0 0 2px #2a3238, 0 12px 40px #000a; border-radius: 4px; }
  [hidden] { display: none !important; }
  button { font: 600 15px "Segoe UI", system-ui, sans-serif; color: #eef5e8; background: #2a3a2c; border: 1px solid #4f7a44; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: #355238; }
  button.ghost { background: #1d2427; border-color: #3a464c; }
  button.ghost:hover { background: #283236; }
  #pauseMenu { position: fixed; left: 50%; top: calc(50% + 10px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; width: 260px; }
  #dev { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,12,.55); }
  #devPanel { width: min(760px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; }
  .devHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .devHead b { font-size: 18px; color: #8be06a; }
  .devActions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .devActions button { font-size: 13px; padding: 6px 12px; }
  #devPanel h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb39a; }
  #devPanel table { width: 100%; border-collapse: collapse; }
  #devPanel th { text-align: left; font-weight: 700; padding: 4px 6px; }
  #devPanel td { padding: 3px 6px; border-top: 1px solid #222b2f; }
  #devPanel td.na { color: #4a565c; text-align: center; }
  #devPanel input[type=number] { width: 100%; box-sizing: border-box; background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  #devPanel input[type=number]:focus { outline: none; border-color: #6cc24a; }
  #devPanel input[type=checkbox] { width: 18px; height: 18px; accent-color: #6cc24a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
  .grid label { display: grid; grid-template-columns: 1fr 86px; align-items: center; gap: 8px; color: #c9d4c4; }
  .note { margin: 16px 0 0; color: #7f8f88; font-size: 12px; }
  #editor, #mapEditor { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; background: rgba(8,10,12,.7); }
  .epanel { width: min(860px, calc(100vw - 32px)); max-height: 92vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; box-sizing: border-box; }
  .epanel h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb39a; }
  .epanel button { font-size: 13px; padding: 6px 12px; }
  .epanel input { background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  .epanel input[type=number] { width: 52px; }
  .pe-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #222b2f; }
  .pe-row .pe-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe-row .pe-size { color: #7f8f88; }
  .pe-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  .pe-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pe-palette button { display: flex; align-items: center; gap: 6px; }
  .pe-palette button.on { border-color: #8be06a; background: #2a3a2c; }
  .pe-palette .pe-cell { width: 16px; height: 16px; }
  .pe-grid { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; user-select: none; touch-action: none; }
  .pe-grid .pe-cell { width: 30px; height: 30px; cursor: crosshair; }
  .epanel { scrollbar-color: #3a464c #161c1f; }
  .pe-thumb { width: 98px; flex: none; }
  .pe-mini { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; }
  .pe-mini .pe-cell { width: 7px; height: 7px; }
  .pe-cell { box-sizing: border-box; }
  .t-none { background: repeating-conic-gradient(#1b2226 0 25%, #252e33 0 50%) 0 0 / 10px 10px; }
  .t-clear { background: #56693f; }
  .t-B, .t-b { background: linear-gradient(#402b21 0 1px, transparent 1px 50%, #402b21 50% calc(50% + 1px), transparent 0) #b3633a; }
  .t-F { background: linear-gradient(#56693f 40%, #a57a46 40% 60%, #56693f 60%); }
  .t-S { background: #9aa6af; border: 3px solid #6f7b85; }
  .t-W { background: #2c6d96; }
  .t-P { background: repeating-linear-gradient(-8deg, #b59e64 0 5px, #c9b277 5px 6px); }
  .t-T, .t-t { background: radial-gradient(circle, #3f8a3a 55%, #2c5e2a 62%, #56693f 64%); }
  .t-b, .t-t { opacity: .5; }
  .epanel select { background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  .pe-pack { border: 1px solid #2f3a40; border-radius: 8px; padding: 8px 12px 4px; margin-top: 12px; }
  .pe-packhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 6px; }
  .pe-pack.folded { padding-bottom: 2px; }
  .pe-pack.folded .pe-packhead { padding-bottom: 6px; }
  .epanel .pe-fold { width: 30px; height: 30px; padding: 0; font-size: 14px; line-height: 1; transition: transform .15s; }
  .pe-pack.folded .pe-fold { transform: rotate(-90deg); }
  .pe-packhead b { flex: 1; min-width: 140px; color: #8be06a; font-size: 14px; }
  .pe-packhead .pe-packname { flex: 1; min-width: 140px; font-weight: 700; }
  .pe-packhead label { display: flex; align-items: center; gap: 6px; }
  .pe-warn { color: #ffc477; margin: 10px 0 0; }
  .pe-msg { min-height: 18px; margin-top: 10px; color: #ff8a7a; }
  .pe-actions { display: flex; gap: 8px; margin-top: 14px; }
  #mapEditorPanel { width: min(1180px, calc(100vw - 32px)); }
  .me-canvas { display: block; cursor: crosshair; touch-action: none; border: 1px solid #0b0f11; }
  .me-thumb { display: block; flex: none; border: 1px solid #0b0f11; }
  .me-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: #9fb39a; font-size: 12px; }
  .me-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
</style>

<body>
<div id="musicControls" style="position:fixed;top:8px;right:10px;z-index:2;display:flex;align-items:center;gap:8px;background:#14181cdd;padding:5px;border-radius:6px;color:#bbc9b5;font-size:12px">
<button id="musicToggle" style="font-size:11px;padding:5px 8px" aria-label="Включить или выключить музыку">♫ Музыка</button><input id="musicVolume" aria-label="Громкость музыки" type="range" min="0" max="1" step="0.01" value="0.22" style="width:70px"></div>
<div id="mapControl" style="position:fixed;top:8px;left:10px;z-index:2;background:#14181cdd;padding:7px;color:#d5dfcc;font-size:12px;border-radius:6px">Карта (новая игра)

<select id="campaignPick" aria-label="Уровень, с которого начать кампанию" hidden style="background:#27332b;color:#eef5e8;border:1px solid #5d7250;padding:4px;max-width:220px"></select>

<button id="btnEditor" class="ghost" style="font-size:12px;padding:4px 10px">Редактор пресетов</button>
<button id="btnMapEditor" class="ghost" style="font-size:12px;padding:4px 10px">Редактор карт</button></div>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas></div>
<div id="pauseMenu" hidden>
  <button id="btnResume">Продолжить</button>
  <button id="btnNewGame" class="ghost">Новая игра</button>
  <button id="btnDev" class="ghost">Настройки разработчика</button>
</div>
<div id="dev" hidden>
  <div id="devPanel">
    <div class="devHead"><b>Настройки разработчика</b><button id="btnDevClose" class="ghost">Закрыть</button></div>
    <div class="devActions">
      <button data-act="heal" class="ghost">Починить танк</button>
      <button data-act="rail" class="ghost">+1 заряд рельсотрона</button>
      <button data-act="powerups" class="ghost">Все бонусы</button>
      <button data-act="kill" class="ghost">Уничтожить врагов</button>
      <button data-act="skip" class="ghost">Следующая волна</button>
      <button data-act="reset" class="ghost">Сбросить настройки</button>
    </div>
    <div id="devBody"></div>
    <p class="note">Изменения применяются сразу и сохраняются в браузере. ХП врагов действует на новых врагов. Количество групп элементов применяется к следующей карте; больше групп — плотнее карта.</p>
  </div>
</div>
<div id="editor" hidden><div id="editorPanel" class="epanel"></div></div>
<div id="mapEditor" hidden><div id="mapEditorPanel" class="epanel"></div></div>

<script>
'use strict';
// ---------- базовые константы и утилиты ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const T=32; let COLS=30,ROWS=20,W=COLS*T,H=ROWS*T;
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, FENCE = 5;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const turnTo = (a, b, s) => { const d = angDiff(a, b); return Math.abs(d) <= s ? b : a + Math.sign(d) * s; };
const blocksTank = t => t === BRICK || t === STEEL || t === WATER || t === FENCE;
const blocksBullet = t => t === BRICK || t === STEEL || t === FENCE;
// забор: узкая перекладина по центру клетки; форма задаётся «плечами» к соседним клеткам
const ARM_N = 1, ARM_E = 2, ARM_S = 4, ARM_W = 8;
const FENCE_H = ARM_E | ARM_W, FENCE_V = ARM_N | ARM_S;
const FENCE_SHAPES = [FENCE_H, FENCE_V, ARM_N | ARM_E, ARM_E | ARM_S, ARM_S | ARM_W, ARM_W | ARM_N];

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function roundedPolygon(c,points,amount) {
  points.forEach(([x,y],i)=>{
    const prev=points[(i+points.length-1)%points.length],next=points[(i+1)%points.length];
    const ax=x+(prev[0]-x)*amount,ay=y+(prev[1]-y)*amount,bx=x+(next[0]-x)*amount,by=y+(next[1]-y)*amount;
    if(!i)c.moveTo(ax,ay);else c.lineTo(ax,ay);
    c.quadraticCurveTo(x,y,bx,by);
  });c.closePath();
}
const KINDS = {
  player:  { hp: 5, speed: 60, turretSpeed: 1, fireRate: 1, color: '#6cc24a', dark: '#2e6b26', bulletSpeed: 1200, dmg: 1, scale: 1 },
  scout:   { hp: 1, speed: 80,  fireRate: 1/.33, color: '#e9b949', dark: '#8c6a1a', bulletSpeed: 380, dmg: 1, scale: .8415, score: 100, scrap: 1, wander: .25, hold: 0,   turretSpeed: 1 },
  soldier: { hp: 2, speed: 50,  fireRate: 2, color: '#e0603f', dark: '#7f2d1b', bulletSpeed: 420, dmg: 1, scale: 1,   score: 200, scrap: 2, wander: .12, hold: 150, turretSpeed: 1 },
  heavy:   { hp: 3, speed: 35,  fireRate: 5, color: '#9483d6', dark: '#463b80', bulletSpeed: 600, dmg: 2, scale: 1.357, score: 500, scrap: 4, wander: .05, hold: 260, turretSpeed: 1 },
};
const ITEMS = {
  armor: { color:'#ffb45e', glyph:'AP', name:'Бронебойные' },
  repair: { color: '#e5484d', glyph: '+',  name: 'Ремонт' },
  rapid:  { color: '#f2c94c', glyph: '»',  name: 'Скорострел' },
  triple: { color: '#4cc3f2', glyph: '3×', name: 'Тройной' },
  shield: { color: '#7be38a', glyph: '◯',  name: 'Щит' },
  rail:   { color: '#c58cff', glyph: '⌁',  name: 'Рельсотрон' },
};
// общие параметры игры (правятся в «Настройках разработчика» в меню паузы)
const CFG = {
  dropChance: .22, heavyDropBonus: .3, powerupTime: 10, repairAmount: 2, railMax: 3,
  waveBase: 6, wavePerLevel: 2, maxAliveBase: 3, maxAliveCap: 7, enemySpeedPerWave: .02, waveBonus: 300, waveHeal: 1,
  mapSize:30, mapMode:'original', mapPick:'', campaignStart:0, mapElements: 42, brickHp: 4, invulnTime: .7, enemySight: 460, treeStealth: 90, shake: 1, hitstop: .06, godMode: false,
};
const SPAWNS = Array.from({length:5},(_,i)=>({c:1+Math.round(27*i/4),r:1}));
const PLAYER_START = { x: W / 2 - 80, y: H - 48 };
const BASE_POS = { x: W / 2 + 16, y: H - 16, r: 16 };

// ---------- звук ----------
let actx = null, noiseBuf = null, muted = false;
const music = new Audio('assets/mehvod.mp3');
music.loop = true; music.volume = .22; music.preload = 'metadata';
let musicOff = false, musicWanted = false, musicLevel = .22;
function syncMusic() {
  const wanted = !muted && !musicOff && state !== 'menu';
  music.volume = musicLevel * ((state === 'pause' || state === 'over' || (player && player.dead)) ? .3 : 1);
  if (wanted !== musicWanted) {
    musicWanted = wanted;
    if(wanted) music.play().catch(e=>{ if(e.name!=='AbortError'){musicWanted=false;musicOff=true;} });
    else music.pause();
  }
  document.getElementById('musicToggle').textContent=musicOff?'♫ Музыка выкл':'♫ Музыка';
}
document.getElementById('musicToggle').addEventListener('click', e=>{e.currentTarget.blur();musicOff=!musicOff;syncMusic();});
document.getElementById('musicVolume').addEventListener('input', e=>{musicLevel=Number(e.target.value);syncMusic();});
let treadTimer=0;
function updateTreadSound(dt) {
  treadTimer-=dt;
  if(muted || !player || player.dead || !['play','between'].includes(state) || Math.hypot(player.vx,player.vy)<1 || treadTimer>0)return;
  treadTimer=.085;
  try { if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    noise(.10,.045,1100);tone(95,55,.08,'triangle',.035);
  } catch(e){}
}
function tone(f0, f1, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t); s.stop(t + dur);
}
// Layered cannon transient, pressure wave and diffuse outdoor tail.
function cannonShot(volume) {
  const t = actx.currentTime, bus = actx.createGain(), comp = actx.createDynamicsCompressor();
  bus.gain.value = volume * .7; comp.threshold.value = -14; comp.ratio.value = 5;
  bus.connect(comp).connect(actx.destination);
  const osc = actx.createOscillator(), sub = actx.createGain();
  osc.frequency.setValueAtTime(115, t); osc.frequency.exponentialRampToValueAtTime(28, t + .4);
  sub.gain.setValueAtTime(.7, t); sub.gain.exponentialRampToValueAtTime(.0001, t + .65);
  osc.connect(sub).connect(bus); osc.start(t); osc.stop(t + .7);
  for (const [delay, duration, cutoff, gain] of [[0,.07,9000,.65],[0,.38,900,.8],[.06,1.3,420,.45],[.14,.75,1800,.12]]) {
    const buffer = actx.createBuffer(1, Math.ceil(actx.sampleRate * duration), actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/data.length*5);
    const src=actx.createBufferSource(), filter=actx.createBiquadFilter(), g=actx.createGain();
    src.buffer=buffer; filter.type='lowpass'; filter.frequency.value=cutoff; g.gain.value=gain;
    src.connect(filter).connect(g).connect(bus); src.start(t+delay);
  }
  // Release the output graph after the final tail.
  setTimeout(() => { bus.disconnect(); comp.disconnect(); }, 1800);
}
function sfx(n) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    switch (n) {
      case 'shoot': cannonShot(1); break;
      case 'eshoot': cannonShot(.45); break;
      case 'leaves': noise(.18, .10, 6500); noise(.3,.05,1700); break;
      case 'hit': noise(.09,.23,5200);tone(1050,260,.13,'triangle',.11);noise(.18,.09,500);break;
      case 'brick': noise(.06, .08, 1300); break;
      case 'fence': noise(.07, .1, 2800); tone(260, 110, .08, 'square', .04); break;
      case 'deflect': tone(1500, 700, .07, 'triangle', .04); break;
      case 'boom': noise(.9, .5, 520); noise(.15, .3, 3500); tone(150, 25, .6, 'sawtooth', .1); break;
      case 'rail': tone(2200, 180, .4, 'sawtooth', .07); noise(.35, .3, 5000); break;
      case 'scrap': tone(900, 600, .06, 'square', .05); setTimeout(() => tone(1200, 800, .06, 'square', .05), 70); break;
      case 'hurt': tone(220, 60, .25, 'sawtooth', .1); noise(.2, .2, 900); break;
      case 'pick': tone(520, 1100, .16, 'triangle', .1); break;
      case 'wave': tone(330, 660, .2, 'triangle', .08); setTimeout(() => tone(440, 880, .25, 'triangle', .08), 150); break;
    }
  } catch (e) { /* звук недоступен — не страшно */ }
}

// ---------- карта ----------
let grid, brickHp, brickMask, brickVariant, fenceArms, foliageMask, foliageShake, brickShake, sand, groundCanvas, gctx;
let flow = new Int32Array(COLS * ROWS);
const tileAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS) ? STEEL : grid[r * COLS + c];

const MAP_SIZES = [30, 45, 60];
const spawnCols = cols => Array.from({length:5},(_,i)=>1+Math.round((cols-3)*i/4));
// клетки, которые игра всегда расчищает: подъезд к базе и точки появления врагов
function reservedCell(cols, c, r) {
  const rows=cols*2/3, center=Math.floor(cols/2);
  if (r>=rows-4 && c>=center-3 && c<=center+2) return true;
  return r<=2 && spawnCols(cols).some(s=>Math.abs(c-s)<=1);
}
function configureMap(size) {
  COLS=MAP_SIZES.includes(Number(size))?Number(size):30; ROWS=COLS*2/3;W=COLS*T;H=ROWS*T;
  const center=Math.floor(COLS/2);
  SPAWNS.splice(0,SPAWNS.length,...spawnCols(COLS).map(c=>({c,r:1})));
  Object.assign(BASE_POS,{x:center*T+16,y:H-16});
  Object.assign(PLAYER_START,{x:center*T-80,y:H-48});

addEventListener('keydown', e => {

  // в редакторе игра не слушает клавиатуру; Esc закрывает его только из списка, чтобы не потерять правки
  if (editorOpen) { if (e.code === 'Escape' && !edit) closeEditor(); return; }
  if (mapEdOpen) {
    if (e.code === 'Escape' && !mapEd) closeMapEditor();
    else if (mapEd && mapStamp && (e.code === 'KeyR' || e.code === 'KeyF') && !['INPUT', 'SELECT'].includes(e.target.tagName)) { turnStamp(e.code === 'KeyR' ? 'turn' : 'flip'); renderMapEditor(); }
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat&&player&&!player.dead&&state==='play')player.boostQueued=true;
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter' && (state === 'menu' || (state === 'over' && overT > .6))) startGame();
  else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; devOpen = false; }
  else if (e.code === 'KeyM') { muted = !muted; syncMusic(); }
  else if (e.code === 'KeyE' && (state === 'play' || state === 'between')) fireRail(player);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') state = 'pause'; });
cv.addEventListener('mousemove', e => {
  const b = cv.getBoundingClientRect();
  mouse.x = (e.clientX - b.left) * W / b.width; mouse.y = (e.clientY - b.top) * H / b.height;
});
cv.addEventListener('mousedown', e => {
  if (e.button === 2 && (state === 'play' || state === 'between')) { fireRail(player); return; }
  if (e.button !== 0) return;
  mouse.down = true;
  if (state === 'menu' || (state === 'over' && overT > .6)) startGame();
  else if (state === 'pause' && !devOpen) state = 'play';
});
addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H) * .97;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---------- физика танков ----------
function brickRects(c,r) {
  const i=r*COLS+c;
  return masonry(0).filter((b,q)=>brickMask[i]&(1<<q)).map(b=>({x:c*T+b.x,y:r*T+b.y,w:b.w,h:8}));
}
function fenceRects(c,r) {
  const arms=fenceArms[r*COLS+c],x=c*T,y=r*T,rects=[];
  if(arms&ARM_N)rects.push({x:x+13,y,w:6,h:19});
  if(arms&ARM_S)rects.push({x:x+13,y:y+13,w:6,h:19});
  if(arms&ARM_E)rects.push({x:x+13,y:y+13,w:19,h:6});
  if(arms&ARM_W)rects.push({x,y:y+13,w:19,h:6});
  return rects;
}
const tileRects=(c,r,type)=>type===BRICK?brickRects(c,r):type===FENCE?fenceRects(c,r):[{x:c*T,y:r*T,w:T,h:T}];
const breakable=t=>t===BRICK||t===FENCE;
function bulletBlocked(x,y,radius=0) {
  const c=Math.floor(x/T),r=Math.floor(y/T),type=tileAt(c,r);
  if(type===STEEL)return true;
  if(!breakable(type))return false;
  return tileRects(c,r,type).some(b=>Math.hypot(x-clamp(x,b.x,b.x+b.w),y-clamp(y,b.y,b.y+b.h))<=radius);
}
function collideTiles(t) {
  const c0=Math.floor((t.x-t.r)/T),c1=Math.floor((t.x+t.r)/T),r0=Math.floor((t.y-t.r)/T),r1=Math.floor((t.y+t.r)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++) {
    const type=tileAt(c,r);if(!blocksTank(type))continue;
    const rects=tileRects(c,r,type);
    for(const b of rects){const px=clamp(t.x,b.x,b.x+b.w),py=clamp(t.y,b.y,b.y+b.h),dx=t.x-px,dy=t.y-py,d=Math.hypot(dx,dy);
      if(d>=t.r)continue;
      if(d===0){const sides=[{v:t.x-b.x,dx:-1,dy:0},{v:b.x+b.w-t.x,dx:1,dy:0},{v:t.y-b.y,dx:0,dy:-1},{v:b.y+b.h-t.y,dx:0,dy:1}].sort((a,b)=>a.v-b.v);t.x+=sides[0].dx*(sides[0].v+t.r);t.y+=sides[0].dy*(sides[0].v+t.r);}
      else {t.x+=dx/d*(t.r-d);t.y+=dy/d*(t.r-d);}
    }
  }
}

function moveTank(t, dx, dy, dt) {
  const terrain=sand[Math.floor(t.y/T)*COLS+Math.floor(t.x/T)]?.5:1;dx*=terrain;dy*=terrain;
  const ox = t.x, oy = t.y;
  t.x += dx; collideTiles(t);
  t.y += dy; collideTiles(t);
  if(base && !base.dead) {
    const bx=t.x-base.x,by=t.y-base.y,d=Math.hypot(bx,by),min=t.r+base.r;
    if(d<min) {t.x=base.x+(d?bx/d:1)*min;t.y=base.y+(d?by/d:0)*min;}
  }
  const m = Math.hypot(t.x - ox, t.y - oy);
  t.vx = (t.x - ox) / dt; t.vy = (t.y - oy) / dt;
  t.tread = (t.tread + m) % 6;
  t.trackAcc += m;
  if (t.trackAcc > 6) { t.trackAcc = 0; trackMark(t); }
  return m;
}

function trackMark(t) {
  const s = KINDS[t.kind].scale;
  gctx.save(); gctx.translate(t.x, t.y); gctx.rotate(t.angle);
  gctx.fillStyle = 'rgba(35,28,15,.12)';
  gctx.fillRect(-2, -13 * s, 4, 5 * s); gctx.fillRect(-2, 8 * s, 4, 5 * s);
  gctx.restore();
}

function separate() {
  const all = enemies.filter(e => !e.dead);
  if (player && !player.dead) all.push(player);
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (d >= min || d === 0) continue;
    const push = (min - d) / 2, nx = dx / d, ny = dy / d;
    a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    collideTiles(a); collideTiles(b);
  }
}

function los(x0, y0, x1, y1) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8);
  for (let i = 1; i < n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
    if (bulletBlocked(x,y)) return false;
  }
  return true;
}

function fire(t) {
  const K = KINDS[t.kind], isP = t === player;
  const ap = (isP && t.armor)||t.kind==='heavy', speed=t.kind==='heavy'?3000:K.bulletSpeed*(ap?1.5:1);
  const spread = isP && t.pw.triple > 0 ? [-.17, 0, .17] : [0];
  const mx = t.x + (isP?Math.cos(t.angle)*5:0) + Math.cos(t.turret)*20*K.scale, my = t.y + (isP?Math.sin(t.angle)*5:0) + Math.sin(t.turret)*20*K.scale;
  for (const da of spread) {
    const a = t.turret + da;
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      owner: isP ? 'p' : 'e', armor: ap, trail: [], dmg: t.kind==='heavy'?2:K.dmg*(ap?2:1), r: t.kind === 'heavy' ? 4 : 3, life: 2.5 });
  }
  t.recoilMax = t.recoil = 5;
  for (let i = 0; i < 6; i++) {
    const a = t.turret + rnd(-.5, .5), s = rnd(40, 140);
    parts.push({ x: mx, y: my, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .15, max: .15, size: rnd(2, 4), color: '#ffd76a' });
  }
  sfx(isP ? 'shoot' : 'eshoot');
}

// рельсотрон: мгновенный луч до стали или края карты, пробивает кирпич и всех врагов на пути
function fireRail(p) {
  if (!p || p.dead || p.rail <= 0) return;
  p.rail--;
  const dx = Math.cos(p.turret), dy = Math.sin(p.turret);
  const x0 = p.x + Math.cos(p.angle)*5 + dx*20, y0 = p.y + Math.sin(p.angle)*5 + dy*20, hit = new Set();
  let len = 0; const foliageRay = {};
  for (; len < 1400; len += 4) {
    const x = x0 + dx * len, y = y0 + dy * len, c = Math.floor(x / T), r = Math.floor(y / T), t = tileAt(c, r);
    if (t === STEEL) break;
    if (t === TREE) hitFoliage(c,r,x,y,foliageRay);
    if (t === BRICK && bulletBlocked(x,y)) hitBrick(c, r, 99);
    if (t === FENCE && bulletBlocked(x,y)) hitFence(c, r, x, y);
    for (const e of enemies) {
      if (e.dead || e.spawnT > 0 || hit.has(e)) continue;
      if ((e.x - x) ** 2 + (e.y - y) ** 2 < (e.r + 4) ** 2) { hit.add(e); hitEnemy(e, { x, y, dmg: 99 }); }
    }
    for (const b of bullets) if (b.owner === 'e' && (b.x - x) ** 2 + (b.y - y) ** 2 < 64) b.dead = true;
    if (len % 24 === 0) parts.push({ x, y, vx: rnd(-40, 40) - dy * rnd(-60, 60), vy: rnd(-40, 40) + dx * rnd(-60, 60), life: .5, max: .5, size: rnd(2, 4), color: '#e2c4ff', kind: 'fire' });
  }
  rails.push({ x0, y0, x1: x0 + dx * len, y1: y0 + dy * len, life: .45, max: .45 });
  p.recoilMax = p.recoil = 9; p.cd = p.reloadDuration = .4;
  shake = Math.max(shake, 9);
  sfx('rail');
}

// ---------- эффекты ----------
function burst(x, y, n, colors, speed, life, size, kind) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(speed * .2, speed);
    const l = rnd(life * .5, life);
    const p = { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, size: rnd(size * .5, size), color: colors[ri(0, colors.length - 1)], kind };
    if (kind === 'debris') { p.rot = rnd(0, 6); p.vr = rnd(-12, 12); }
    parts.push(p);
  }
}
function blastDamage(x,y,diameter=30) {
  const radius=diameter*1.5;
  for(let r=Math.max(0,Math.floor((y-radius)/T));r<=Math.min(ROWS-1,Math.floor((y+radius)/T));r++)
    for(let c=Math.max(0,Math.floor((x-radius)/T));c<=Math.min(COLS-1,Math.floor((x+radius)/T));c++) {
      const hx=clamp(x,c*T,(c+1)*T),hy=clamp(y,r*T,(r+1)*T);
      if(Math.hypot(x-hx,y-hy)<=radius){const t=grid[r*COLS+c];if(t===BRICK)hitBrick(c,r,1,hx,hy);else if(t===FENCE)hitFence(c,r,hx,hy);else if(t===TREE)hitFoliage(c,r,hx,hy,{});}
    }
  // Marked-dead tanks are ignored, so chain explosions cannot award duplicate kills.
  for(const e of [...enemies]) if(!e.dead && e.spawnT<=0 && Math.hypot(e.x-x,e.y-y)<=radius)hitEnemy(e,{x,y,dmg:1,blast:true});
  if(player&&!player.dead&&Math.hypot(player.x-x,player.y-y)<=radius)hitPlayer({x,y,dmg:1,blast:true});
}
function explosion(x, y, big, color, sizeMultiplier=1) {
  const k = (big ? 1.4 : 1)*sizeMultiplier;
  parts.push({ x, y, vx: 0, vy: 0, life: .2, max: .2, size: 70 * k, kind: 'flash' });
  parts.push({ x, y, vx: 0, vy: 0, life: .45, max: .45, size: 80 * k, kind: 'ring' });
  burst(x, y, 50 * k, ['#fff3c0', '#ffe08a', '#ff9a3c', '#e8442c', '#ffcf5a'], 300 * k, .7, 9 * k, 'fire');
  burst(x, y, 26 * k, ['#fff', '#ffe9a0', '#ffb24a'], 560, .5, 2, 'spark');
  burst(x, y, 12 * k, [color || '#666', '#2a2a2a', '#4a4a4a'], 280, 1.1, 7, 'debris');
  burst(x, y, 22 * k, ['#2e2e2e', '#444', '#5a5a5a'], 90, 1.8, 13 * k, 'smoke');
  shake = Math.max(shake, big ? 20 : 13);
  hitstop = Math.max(hitstop, CFG.hitstop);
  gctx.fillStyle = 'rgba(20,15,10,.4)';
  gctx.beginPath(); gctx.arc(x, y, 24 * k, 0, Math.PI * 2); gctx.fill();
  gctx.fillStyle = 'rgba(20,15,10,.2)';
  for (let i = 0; i < 8; i++) {
    const a = rnd(0, 6), d = rnd(18, 36) * k;
    gctx.beginPath(); gctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rnd(4, 9), 0, Math.PI * 2); gctx.fill();
  }
  sfx('boom');
}
function floatText(x, y, text, color) {
  parts.push({ x, y, vx: 0, vy: -40, life: 1, max: 1, text, color });
}

// ---------- обновление ----------
function fragmentBlocked(x,y,radius) {
  if(x-radius<0||y-radius<0||x+radius>W||y+radius>H)return true;
  for(let r=Math.floor((y-radius)/T);r<=Math.floor((y+radius)/T);r++)
    for(let c=Math.floor((x-radius)/T);c<=Math.floor((x+radius)/T);c++) {
      const tile=tileAt(c,r),rects=breakable(tile)||tile===STEEL?tileRects(c,r,tile):[];
      if(rects.some(b=>Math.hypot(x-clamp(x,b.x,b.x+b.w),y-clamp(y,b.y,b.y+b.h))<radius))return true;
    }
  return false;
}
function fragmentEscape(x,y,radius) {
  const rays=[];
  for(let k=0;k<32;k++) {
    const angle=k*Math.PI/16,dx=Math.cos(angle),dy=Math.sin(angle);
    let clearance=0;
    for(let d=2;d<=72;d+=2){if(fragmentBlocked(x+dx*d,y+dy*d,radius))break;clearance=d;}
    rays.push({angle,clearance});
  }
  const best=Math.max(...rays.map(ray=>ray.clearance));
  const choices=rays.filter(ray=>ray.clearance>=Math.max(2,best-2));
  return choices.length?choices[ri(0,choices.length-1)]:{angle:0,clearance:0};
}
function hitBrick(c, r, dmg, hx = c*T+16, hy = r*T+16) {
  const i = r * COLS + c;
  if (grid[i] !== BRICK) return;
  brickShake[i]=.25;
  const previousMask=brickMask[i];
  if (dmg >= 99) { brickHp[i] = 0; brickMask[i] = 0; }
  else {
    const bricks = masonry(0);
    const surviving = bricks.map((b,q)=>({b,q})).filter(({q})=>brickMask[i] & (1<<q));
    surviving.sort((a,b)=>Math.hypot(c*T+a.b.x+a.b.w/2-hx,r*T+a.b.y+4-hy)-Math.hypot(c*T+b.b.x+b.b.w/2-hx,r*T+b.b.y+4-hy)+(((a.q+brickVariant[i])%3)-((b.q+brickVariant[i])%3))*2);
    const count = Math.ceil(surviving.length / brickHp[i]);
    for(const {q} of surviving.slice(0,count)) brickMask[i] &= ~(1<<q);
    brickHp[i]--;
  }
  masonry(0).forEach((b,q)=>{
    if(!(previousMask&(1<<q))||(brickMask[i]&(1<<q)))return;
    // Fragments originate inside the specific bricks removed by this impact.
    for(let row=0;row<2;row++)for(let col=0;col<2;col++){
      const w=b.w/2,h=4,x=c*T+b.x+(col+.5)*w,y=r*T+b.y+(row+.5)*h;
      const escape=fragmentEscape(x,y,Math.min(w,h)*.35),angle=escape.angle;
      const speed=Math.min(rnd(45,135),escape.clearance*2),life=rnd(.9,1.7);
      parts.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life,max:life,w:w-.6,h:h-.5,size:w,rot:0,vr:rnd(-8,8),color:['#b3633a','#a95833','#bd7149'][(q+brickVariant[i])%3],kind:'debris',brickFragment:true});
    }
  });
  burst(hx, hy, 10, ['#b3633a', '#8c4a2b', '#d08a5c'], 120, .4, 4);
  if (brickHp[i] <= 0) {
    grid[i] = EMPTY; flowTimer = 0;
    burst(c*T+16, r*T+16, 14, ['#b3633a', '#8c4a2b'], 160, .6, 5);
  }
  sfx('brick');
}
// забор слабее кирпича: ломается с одного попадания и разлетается щепой
function hitFence(c, r, hx = c*T+16, hy = r*T+16) {
  const i = r * COLS + c;
  if (grid[i] !== FENCE) return;
  for (const b of fenceRects(c, r)) for (let k = 0; k < 4; k++) {
    const x = b.x + rnd(0, b.w), y = b.y + rnd(0, b.h), a = Math.atan2(y - hy, x - hx) + rnd(-.8, .8), s = rnd(60, 170), life = rnd(.7, 1.3);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, w: rnd(5, 9), h: 2, size: 6, rot: rnd(0, 6), vr: rnd(-10, 10), color: ['#8a6338', '#a57a46', '#6f4d2b'][k % 3], kind: 'debris' });
  }
  burst(hx, hy, 8, ['#c49a62', '#8a6338'], 110, .35, 3);
  grid[i] = EMPTY; fenceArms[i] = 0; flowTimer = 0;
  sfx('fence');
}

function hitEnemy(e, b) {
  if(e.dead || e.spawnT > 0) return;
  e.hp -= b.dmg; e.flash = .13;shake=Math.max(shake,2);
  burst(b.x,b.y,18,['#fff4bd','#ffb650','#d7e6ed'],260,.35,4,'spark');
  if (e.hp > 0) { burst(b.x, b.y, 10, ['#fff', '#ffd76a'], 180, .3, 4); sfx('hit'); return; }
  e.dead = true;
  const K = KINDS[e.kind];
  score += K.score;
  floatText(e.x, e.y - 10, '+' + K.score, '#ffe08a');

  wrecks.push({ x: e.x, y: e.y, kind: e.kind, angle: e.angle, turret: e.turret, tread:e.tread, recoil:e.recoil, flash:0, age: 0, smokeT: 0, detonateAt:rnd(.5,1.5)*(b.blast?.5:1), exploded:false });
  if (Math.random() < CFG.dropChance + (e.kind === 'heavy' ? CFG.heavyDropBonus : 0)) {
    const types = Object.keys(ITEMS);
    items.push({ x: e.x, y: e.y, type: types[ri(0, types.length - 1)], life: 12 });
  }
}

function hitPlayer(b) {
  const p = player;
  if (!p || p.dead) return;
  if (p.pw.shield > 0 || CFG.godMode) { burst(b.x, b.y, 10, ['#9ff5aa', '#e0ffe4'], 160, .3, 3); sfx('deflect'); return; }
  if (p.inv > 0) return;
  p.hp -= b.dmg; p.inv = CFG.invulnTime; p.flash = .15;
  shake = Math.max(shake, 10);
  sfx('hurt');
  if (p.hp <= 0) { p.hp = 0; p.dead = true; p.armor=false; const delay=rnd(.5,1.5)*(b.blast?.5:1); wrecks.push({x:p.x,y:p.y,kind:'player',angle:p.angle,turret:p.turret,tread:p.tread,recoil:p.recoil,flash:0,age:0,smokeT:0,taken:true,detonateAt:delay,exploded:false}); deadT = delay+2; }
}

function updatePlayer(dt) {
  const p = player;
  if (p.dead) return;
  p.boostCooldown=Math.max(0,p.boostCooldown-dt);
  if(p.boostLeft>0){p.boostLeft=Math.max(0,p.boostLeft-dt);if(!p.boostLeft)p.boostCooldown=10;}
  const shift=!!(keys.ShiftLeft||keys.ShiftRight);
  if((p.boostQueued||(shift&&!p.shiftHeld))&&p.boostLeft<=0&&p.boostCooldown<=0){p.boostLeft=2;sfx('pick');}
  p.boostQueued=false;
  p.shiftHeld=shift;
  const steer = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const throttle = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  p.angle += steer * 2.2 * dt;
  p.vx = p.vy = 0;
  if (throttle) moveTank(p, Math.cos(p.angle)*throttle*KINDS.player.speed*(p.boostLeft>0?2:1)*dt, Math.sin(p.angle)*throttle*KINDS.player.speed*(p.boostLeft>0?2:1)*dt, dt);
  p.turret = turnTo(p.turret, Math.atan2(mouse.y - p.y, mouse.x - p.x), dt * KINDS.player.turretSpeed);
  p.cd -= dt; p.inv -= dt; p.recoil=(p.recoilMax||5)*(1-reloadProgress(p));
  for (const k in p.pw) p.pw[k] = Math.max(0, p.pw[k] - dt);
  if ((mouse.down || keys.Space) && p.cd <= 0) {
    fire(p);
    p.cd = p.reloadDuration = KINDS.player.fireRate * (p.pw.rapid > 0 ? .45 : 1);
  }
}

function decide(e, random) {
  const K = KINDS[e.kind], c = Math.floor(e.x / T), r = Math.floor(e.y / T);
  const opts = [];
  for (const [dc, dr] of DIRS) {
    const nc = c + dc, nr = r + dr, t = tileAt(nc, nr);
    if (t === STEEL || t === WATER) continue;
    if (random && breakable(t) && e.kind!=='heavy') continue;
    opts.push({ nc, nr, t, v: flow[nr * COLS + nc] });
  }
  e.brick = null;
  if (!opts.length) { e.tx = c * T + 16; e.ty = r * T + 16; return; }

const LEAF_BLOBS=[[-6,-5,12],[7,-4,11],[-4,7,11],[7,7,10],[0,0,12]];

function updateItems(dt) {
  for (const it of items) {
    it.life -= dt;
    if (player && !player.dead && Math.hypot(player.x - it.x, player.y - it.y) < 24) {

      else if (it.type === 'armor') player.armor=true;
      else if (it.type === 'rail') player.rail = Math.min(CFG.railMax, player.rail + 1);
      else player.pw[it.type] = CFG.powerupTime;
      floatText(it.x, it.y - 12, ITEMS[it.type].name, ITEMS[it.type].color);
      sfx('pick');
    }
  }
  items = items.filter(it => it.life > 0);
}

function collectRemainingScrap() {
  let collected=0;
  for(const w of wrecks)if(!w.taken && w.kind!=='player'){collected+=KINDS[w.kind].scrap;w.taken=true;}
  scrap+=collected;
  return collected;
}
function updateWrecks(dt) {

    if(w.exploded===false && w.age>=w.detonateAt) {
      if(w.kind==='player') {
        w.blastCount=w.blastCount||0;
        const offsets=[[-9,-5],[9,-3],[0,8]];
        while(w.blastCount<3&&w.age>=w.detonateAt+w.blastCount*.5) {
          const [dx,dy]=offsets[w.blastCount++];

        }

      } else {
        w.exploded=true;w.blastAge=w.age;
        explosion(w.x,w.y,w.kind==='heavy',KINDS[w.kind].color);blastDamage(w.x,w.y,30*KINDS[w.kind].scale);
      }
    }
    if (w.smokeT <= 0 && w.age < 2) {
      w.smokeT = .12 + w.age * .05;
      parts.push({ x: w.x + rnd(-6, 6), y: w.y + rnd(-6, 6), vx: rnd(-8, 8), vy: rnd(-30, -15), life: 1.4, max: 1.4, size: rnd(5, 9), color: '#3d3d3d', kind: 'smoke' });
    }

      floatText(w.x, w.y - 12, `+${n} металлолом`, '#d9c27a');
      burst(w.x, w.y, 10, ['#8a8a8a', '#b5a27a', '#555'], 140, .5, 4, 'debris');

}

function updateSpawns(dt) {
  spawnTimer -= dt;
  if (!toSpawn.length || spawnTimer > 0 || enemies.length >= maxAlive()) return;
  const free = SPAWNS.filter(s => {
    const x = s.c * T + 16, y = s.r * T + 16;
    return !enemies.concat(player && !player.dead ? [player] : []).some(t => Math.hypot(t.x - x, t.y - y) < 40);
  });
  if (!free.length) return;
  const s = free[ri(0, free.length - 1)];
  const e = makeTank(s.c * T + 16, -32, toSpawn.pop());
  e.angle = e.turret = Math.PI / 2; e.spawnT = 0; e.entering=true;
  enemies.push(e);
  spawnTimer = rnd(1.2, 2.4);
}

function updateParts(dt) {
  for(let i=0;i<brickShake.length;i++)brickShake[i]=Math.max(0,brickShake[i]-dt);
  for(let i=0;i<foliageShake.length;i++)foliageShake[i]=Math.max(0,foliageShake[i]-dt);
  const DRAG = { smoke: .3, spark: .15, debris: .08 };
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    const drag = p.text ? 1 : Math.pow(DRAG[p.kind] || .05, dt);
    p.vx *= drag; p.vy *= drag;
    if (p.kind === 'smoke') p.vy -= 25 * dt;
    if (p.kind === 'debris') p.rot += p.vr * dt;
    p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const r of rails) r.life -= dt;
  rails = rails.filter(r => r.life > 0);
}

function update(dt) {
  time += dt;
  if (state === 'menu' || state === 'pause') return;
  updateBaseCollapse(dt);
  if (hitstop > 0) { hitstop -= dt; return; }
  updateParts(dt);
  shake = Math.max(0, shake - dt * 30);
  banner.t -= dt;
  if (state === 'over') { overT += dt; return; }

  if (player) {
    player.flash -= dt;
    flowTimer -= dt;
    if (flowTimer <= 0 && !player.dead) {
      const goal=base && !base.dead ? base : player;
      buildFlow(clamp(Math.floor(goal.x / T), 0, COLS - 1), clamp(Math.floor(goal.y / T), 0, ROWS - 1));
      flowTimer = .4;
    }
  }
  updatePlayer(dt); updateTreadSound(dt);
  if (state === 'play') updateSpawns(dt);
  formColumns();
  for (const e of enemies) updateEnemy(e, dt);
  enemies = enemies.filter(e => !e.dead);
  separate();
  updateBullets(dt);
  enemies = enemies.filter(e => !e.dead);
  updateItems(dt);
  updateWrecks(dt);

  if (player.dead || (base && base.dead)) {
    deadT -= dt;
    if (deadT <= 0 && !(base&&base.dead&&base.collapseCount<3)) {
      state = 'over'; overT = 0;
      if (score > best) { best = score; try { localStorage.setItem('ecotank-best', best); } catch (e) {} }
      // повтор кампании начинается с проигранного уровня
      if (campaign) { CFG.campaignStart = wave - 1; saveDev(); }
    }
  } else if (state === 'play' && !toSpawn.length && !enemies.length && !wrecks.some(w=>w.exploded===false)) {
    const bonus = CFG.waveBonus * wave;
    score += bonus;
    const collected=collectRemainingScrap();
    if (campaign) unlockCampaign(Math.min(wave + 1, campaign.length));
    banner = { text: campaign ? (wave >= campaign.length ? 'Последний уровень пройден!' : 'Уровень пройден!') : 'Волна пройдена!', sub: `Бонус +${bonus} · Металлолом +${collected}`, t: 2.5 };
    state = 'between'; betweenT = 2.8;
    sfx('wave');
  } else if (state === 'between') {
    betweenT -= dt;
    if (betweenT <= 0) nextWave();
  }
}

function tileHash(c, r) { let h = (c * 73856093) ^ (r * 19349663); h = (h ^ (h >>> 13)) * 1274126177; return (h >>> 0) / 4294967296; }

    const t = grid[r * COLS + c], x = c * T, y = r * T;
    if (t === BRICK) drawBrick(x, y, brickHp[r * COLS + c], brickMask[r * COLS + c], brickVariant[r * COLS + c]);
    else if (t === FENCE) drawFence(c, r);
    else if (t === STEEL) drawSteel(x, y);
    else if (t === WATER) drawWater(x, y, c, r);
  }
}

// Three bonds use staggered brick lengths; damage removes whole bricks along mortar joints.
function masonry(variant) {
  const bricks=[], offset=[8,6,11][variant];
  for(let row=0;row<4;row++) {
    const cuts=row%2?[0,offset,offset+16,32]:[0,16,32];
    for(let j=0;j<cuts.length-1;j++) bricks.push({x:cuts[j],y:row*8,w:cuts[j+1]-cuts[j]});
  }
  return bricks;
}
function drawBrick(x,y,hp,mask,variant) {
  const i=Math.floor(y/T)*COLS+Math.floor(x/T),jolt=brickShake[i]*5;
  ctx.save();ctx.translate(Math.sin(time*65+i)*jolt,Math.cos(time*59+i)*jolt*.5);
  masonry(0).forEach((b,q)=>{
    if(!(mask & (1<<q)))return;
    ctx.fillStyle='#402b21';ctx.fillRect(x+b.x,y+b.y,b.w,8);
    ctx.fillStyle=['#b3633a','#a95833','#bd7149'][Math.abs(Math.floor((x+b.x+(b.y%16?8:0))/16)+Math.floor((y+b.y)/8))%3];
    ctx.fillRect(x+b.x,y+b.y+1,b.w,7);
    if(b.x>0 || b.y%16===0){ctx.fillStyle='#402b21';ctx.fillRect(x+b.x,y+b.y,1,8);}
    ctx.fillStyle='#d18b6066';ctx.fillRect(x+b.x+1,y+b.y+1,b.w-2,1);
    if(hp<4){ctx.strokeStyle='#502c23';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+b.x+b.w*.3,y+b.y+1);ctx.lineTo(x+b.x+b.w*.6,y+b.y+4);ctx.lineTo(x+b.x+b.w*.5,y+b.y+7);ctx.stroke();}
  });
  ctx.restore();
}

// вид сверху: доска-перекладина по каждому плечу, столбы в центре и на краях клетки
function drawFence(c, r) {
  const rects = fenceRects(c, r), x = c * T, y = r * T, arms = fenceArms[r * COLS + c];
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  for (const b of rects) ctx.fillRect(b.x + 2, b.y + 3, b.w, b.h);
  for (const b of rects) {
    ctx.fillStyle = '#5a3d22'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#a57a46'; ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.fillStyle = '#c49a62'; b.w > b.h ? ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 1) : ctx.fillRect(b.x + 1, b.y + 1, 1, b.h - 2);
  }
  const posts = [[16, 16]];
  if (arms & ARM_N) posts.push([16, 3]); if (arms & ARM_S) posts.push([16, 29]);
  if (arms & ARM_E) posts.push([29, 16]); if (arms & ARM_W) posts.push([3, 16]);
  for (const [px, py] of posts) {
    ctx.fillStyle = '#3f2a17'; ctx.fillRect(x + px - 4, y + py - 4, 8, 8);
    ctx.fillStyle = '#7a5531'; ctx.fillRect(x + px - 3, y + py - 3, 6, 6);
    ctx.fillStyle = '#5a3d22'; ctx.fillRect(x + px - 1, y + py - 1, 2, 2);
  }
}

function drawSteel(x, y) {
  ctx.fillStyle = '#6f7b85'; ctx.fillRect(x, y, T, T);
  ctx.fillStyle = '#9aa6af'; ctx.fillRect(x + 3, y + 3, T - 6, T - 6);
  ctx.fillStyle = '#b9c3ca'; ctx.fillRect(x + 3, y + 3, T - 6, 3);
  ctx.fillStyle = '#5b666f';
  for (const [ox, oy] of [[7, 7], [25, 7], [7, 25], [25, 25]]) { ctx.beginPath(); ctx.arc(x + ox, y + oy, 2, 0, Math.PI * 2); ctx.fill(); }
}

function drawWater(x, y, c, r) {
  ctx.fillStyle = '#2c6d96'; ctx.fillRect(x, y, T, T);
  ctx.strokeStyle = 'rgba(190,230,255,.35)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 2; k++) {
    const yy = y + 8 + k * 16 + Math.sin(time * 2 + k) * 2;
    ctx.beginPath();
    for (let xx = 0; xx <= T; xx += 4) ctx.lineTo(x + xx, yy + Math.sin((x + xx) * .25 + time * 3) * 1.5);
    ctx.stroke();
  }
}

function drawTrees() {
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) {
    const i=r*COLS+c;if(grid[i]!==TREE)continue;
    const x=c*T+16,y=r*T+16,shake=foliageShake[i]*7;
    const sway=Math.sin(time*1.5+tileHash(c,r)*10)+Math.sin(time*42+i)*shake;
    LEAF_BLOBS.forEach(([ox,oy,rr],q)=>{
      if(!(foliageMask[i]&(1<<q)))return;
      ctx.fillStyle='#13291155';ctx.beginPath();ctx.arc(x+ox+3,y+oy+4,rr,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2f6b2b';ctx.beginPath();ctx.arc(x+ox+sway,y+oy,rr,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4a913a';ctx.beginPath();ctx.arc(x+ox-2+sway,y+oy-2,rr*.6,0,Math.PI*2);ctx.fill();
    });
  }
}

function drawFlames(x,y,strength=1) {
  for(let i=0;i<3;i++) {
    const f=.5+.5*Math.sin(time*17+i*2+x),h=(8+8*f)*strength;
    ctx.fillStyle='#ed542bdd';ctx.beginPath();ctx.ellipse(x+(i-1)*5,y-h/2,3.5*strength,h/2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd875';ctx.beginPath();ctx.ellipse(x+(i-1)*5,y-2,1.7*strength,h*.22,0,0,Math.PI*2);ctx.fill();
  }
}
function boostProgress(p){return p.boostLeft>0?clamp(p.boostLeft/2,0,1):clamp(1-(p.boostCooldown||0)/10,0,1);}
function recoilOffset(t){if(!Number.isFinite(t.cd))return t.recoil||0;return (t.recoilMax||5)*(t===player?1-reloadProgress(t):clamp(t.cd/enemyInterval(t.kind),0,1));}
function reloadProgress(p) { return clamp(1-Math.max(0,p.cd)/(p.reloadDuration||KINDS.player.fireRate),0,1); }
// Pixel geometry based on the supplied olive tank reference; body and turret rotate separately.
function drawPlayerModel(t) {
  const isP=t.kind==='player',heavy=t.kind==='heavy',panther=t.kind==='soldier';
  const base=isP?'#7f8e3e':heavy?'#858c94':panther?'#7c8796':'#89939e';
  const dark=isP?'#3f4c25':'#3e4651',light=isP?'#bac47b':'#b3bac2',flash=t.flash>0;
  ctx.save();ctx.translate(t.x,t.y);ctx.scale(KINDS[t.kind].scale,KINDS[t.kind].scale);ctx.rotate(t.angle+Math.PI/2);
  ctx.fillStyle='#161b1c';ctx.fillRect(-16,-17,32,35);
  for(const x of [-16,10]){ctx.fillStyle='#343a3d';ctx.fillRect(x,-16,6,33);for(let y=-16;y<17;y+=5){ctx.fillStyle='#81858b';ctx.fillRect(x,y+(t.tread%5),6,2);}}
  ctx.fillStyle=flash?'#fff':base;
  ctx.beginPath();ctx.moveTo(-9,-17);ctx.lineTo(9,-17);ctx.lineTo(13,-7);ctx.lineTo(12,16);ctx.lineTo(-12,16);ctx.lineTo(-13,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle=light;ctx.fillRect(-12,-16,4,28);ctx.fillRect(8,-16,4,28);
  ctx.fillStyle=dark;ctx.fillRect(-7,5,14,10);ctx.fillRect(-7,-14,14,4);
  ctx.fillStyle=base;for(let y=6;y<15;y+=3)ctx.fillRect(-6,y,12,1);
  if(heavy){ctx.fillStyle='#20262d';for(let x=-7;x<8;x+=3)ctx.fillRect(x,6,1,8);ctx.strokeStyle=light;ctx.strokeRect(-3,9,6,5);}
  if(isP){ctx.fillStyle='#24331c';ctx.fillRect(-12,10,6,9);ctx.fillRect(6,10,6,9);ctx.fillStyle='#879655';ctx.fillRect(-11,10,4,8);ctx.fillRect(7,10,4,8);ctx.fillStyle='#bfca85';ctx.fillRect(-11,10,4,2);ctx.fillRect(7,10,4,2);}
  ctx.restore();ctx.save();ctx.translate(t.x+(isP?Math.cos(t.angle)*5:0),t.y+(isP?Math.sin(t.angle)*5:0));ctx.scale(KINDS[t.kind].scale,KINDS[t.kind].scale);ctx.rotate(t.turret+Math.PI/2);
  const barrel=-30+(!t.dead?recoilOffset(t):t.recoil);ctx.fillStyle='#171d20';ctx.fillRect(-3,barrel,6,29);ctx.fillRect(-4,barrel-2,8,5);
  ctx.fillStyle=light;ctx.fillRect(-1,barrel,3,27);
  const poly=heavy?[[-10,-10],[9,-10],[12,-5],[12,8],[7,12],[-9,12],[-13,6],[-13,-5]]:panther?[[-6,-12],[6,-12],[13,5],[9,12],[-9,12],[-13,5]]:isP?[[-5,-12],[5,-12],[11,4],[7,12],[-7,12],[-11,4]]:[[-7,-10],[7,-10],[11,8],[6,12],[-8,12],[-11,5]];
  ctx.fillStyle=flash?'#fff':base;ctx.strokeStyle='#161c20';ctx.lineWidth=2;ctx.beginPath();if(isP)roundedPolygon(ctx,poly,.22);else{poly.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}ctx.fill();ctx.stroke();
  ctx.fillStyle=dark;ctx.fillRect(-6,-3,6,6);ctx.fillRect(3,1,5,5);ctx.fillStyle=light;ctx.fillRect(-5,-4,4,2);ctx.fillRect(4,2,3,2);
  if(isP){ctx.fillStyle='#d55d43';ctx.fillRect(5,5,3,3);}else{ctx.fillStyle='#e0e3df';ctx.fillRect(-2,-7,5,1);ctx.fillRect(0,-9,1,5);}
  ctx.restore();
}

function drawTank(t) {
  const K = KINDS[t.kind], s = K.scale;
  ctx.save();
  if(t.spawnT>0)ctx.globalAlpha=clamp(1-t.spawnT,0,1);
  if(t===player && t.inv>0 && Math.floor(time*20)%2)ctx.globalAlpha=.45;
  drawPlayerModel(t);ctx.restore();
  if((t===player||t.kind==='soldier'||t.kind==='heavy') && t.hp<t.maxHp && t.spawnT<=0) {
    ctx.fillStyle='#282323aa';ctx.beginPath();ctx.ellipse(t.x-6,t.y-12,6,11,0,0,Math.PI*2);ctx.fill();
    drawFlames(t.x-6,t.y+2,t.hp/t.maxHp<=.5?1:.65);
  }
  if(t===player) {
    const progress=boostProgress(t),y=t.y+t.r+7;
    ctx.fillStyle='#0b151be0';ctx.fillRect(t.x-11,y,22,4);
    ctx.fillStyle=t.boostLeft>0?'#7cd6ed':progress>=1?'#a6e67a':'#f1c56b';ctx.fillRect(t.x-10,y+1,20*progress,2);
  }
  if (t === player && t.pw.shield > 0) {
    const a = t.pw.shield < 2 && Math.floor(time * 8) % 2 ? .15 : .5;
    ctx.strokeStyle = `rgba(140,240,160,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r + 7 + Math.sin(time * 6), 0, Math.PI * 2); ctx.stroke();
  }
  if (t !== player && t.spawnT <= 0 && t.hp < t.maxHp) {
    const w = 26 * s;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(t.x - w / 2, t.y - t.r - 9, w, 4);
    ctx.fillStyle = '#ff6b5a'; ctx.fillRect(t.x - w / 2, t.y - t.r - 9, w * t.hp / t.maxHp, 4);
  }
}

function drawItems() {
  for (const it of items) {
    if (it.life < 3 && Math.floor(time * 8) % 2) continue;
    const I = ITEMS[it.type], y = it.y + Math.sin(time * 4 + it.x) * 3;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(it.x, it.y + 12, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1d2226'; roundRect(ctx, it.x - 12, y - 12, 24, 24, 6); ctx.fill();
    ctx.strokeStyle = I.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = I.color; ctx.font = 'bold 14px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(I.glyph, it.x, y + 1);
  }
}

function drawWrecks() {
  for (const w of wrecks) {
    if(w.exploded===false) {
      ctx.save();ctx.filter='brightness(40%)';drawPlayerModel(w);ctx.restore();
      drawFlames(w.x,w.y,.9);
      continue;
    }
    const K = KINDS[w.kind], s = K.scale;
    ctx.save();
    ctx.translate(w.x, w.y);
    const pulse = .25 + .2 * Math.sin(time * 4 + w.x);
    ctx.strokeStyle = `rgba(217,194,122,${pulse})`; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(0, 0, 19 * s, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.scale(s, s);
    ctx.save();
    ctx.rotate(w.angle);
    ctx.fillStyle = '#1b1c1d';
    ctx.fillRect(-15, -15, 27, 7); ctx.fillRect(-13, 8, 30, 7);
    ctx.fillStyle = '#3a3532'; roundRect(ctx, -13, -9, 26, 18, 3); ctx.fill();
    ctx.fillStyle = K.dark; ctx.globalAlpha = .35; ctx.fillRect(-11, -7, 15, 9); ctx.globalAlpha = 1;
    ctx.restore();
    ctx.rotate(w.turret);
    ctx.translate(3, 2);
    ctx.fillStyle = '#2a2624'; ctx.fillRect(2, -2.5, 12, 5);
    ctx.fillStyle = '#423b36'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (w.exploded!==false && w.age-(w.blastAge||0) < 2) {
      drawFlames(w.x,w.y,1-w.age*.2);
      for (let i = 0; i < 3; i++) {
        const f = Math.sin(time * 13 + i * 2.1 + w.x) * .5 + .5;
        ctx.fillStyle = `rgba(255,${120 + f * 80 | 0},40,${(1 - w.age / 2) * f})`;
        ctx.beginPath(); ctx.arc(w.x + (i - 1) * 6, w.y + Math.sin(i * 3) * 5, 2 + f * 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

function drawRails() {
  ctx.lineCap = 'round';
  for (const r of rails) {
    const a = r.life / r.max;
    ctx.strokeStyle = `rgba(170,110,255,${a * .45})`; ctx.lineWidth = 16 * a + 2;
    ctx.beginPath(); ctx.moveTo(r.x0, r.y0); ctx.lineTo(r.x1, r.y1); ctx.stroke();
    ctx.strokeStyle = `rgba(240,225,255,${a})`; ctx.lineWidth = 4 * a + 1;
    ctx.beginPath(); ctx.moveTo(r.x0, r.y0); ctx.lineTo(r.x1, r.y1); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawBullets() {
  for (const b of bullets) {
    if(b.armor && b.trail && b.trail.length){ctx.strokeStyle='#ffe4a7aa';ctx.lineWidth=2;ctx.beginPath();b.trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(b.x,b.y);ctx.stroke();}
    ctx.strokeStyle = b.owner === 'p' ? 'rgba(200,255,170,.35)' : 'rgba(255,170,140,.35)';
    ctx.lineWidth = b.r * 1.4;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .025, b.y - b.vy * .025); ctx.stroke();
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));
    const width=b.r, length=b.armor?12:10;
    ctx.fillStyle=b.armor?'#ffce78':b.owner==='p'?'#cfe4ba':'#d8b5a1';
    ctx.beginPath();ctx.moveTo(length*.6,0);ctx.quadraticCurveTo(length*.2,-width,-length*.55,-width);ctx.lineTo(-length*.55,width);ctx.quadraticCurveTo(length*.2,width,length*.6,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#645543';ctx.fillRect(-length*.55,-width,2,width*2);
    ctx.strokeStyle='#fff3c3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-length*.3,-width*.4);ctx.lineTo(length*.25,-width*.25);ctx.stroke();ctx.restore();
  }
}

function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = p.kind === 'fire' || p.kind === 'spark' || p.kind === 'flash' ? 'lighter' : 'source-over';
    if(p.kind==='bird'){const flap=Math.sin(time*24+p.phase)*5;ctx.strokeStyle=p.color||'#1c2927';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(p.x-6,p.y+flap);ctx.lineTo(p.x,p.y);ctx.lineTo(p.x+6,p.y+flap);ctx.stroke();}
    else if (p.text) {
      ctx.fillStyle = p.color; ctx.font = 'bold 15px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
    } else if (p.kind === 'flash') {
      ctx.fillStyle = '#fff4d0';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.2 - a * .4), 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'ring') {
      ctx.strokeStyle = '#ffe3b0'; ctx.lineWidth = 6 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - a * a), 0, Math.PI * 2); ctx.stroke();
    } else if (p.kind === 'spark') {
      ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(2,(p.size||2)*.9);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .065, p.y - p.vy * .065); ctx.stroke();
    } else if (p.kind === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const width=p.w||p.size,height=p.h||p.size*.66;
      ctx.fillStyle = p.color; ctx.fillRect(-width/2,-height/2,width,height);
      ctx.restore();
    } else if (p.kind === 'smoke') {
      ctx.globalAlpha = a * .6;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - a), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.kind === 'fire' ? .4 + .6 * a : a), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function text(str, x, y, size, color, align = 'left', weight = '600') {
  ctx.font = `${weight} ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(str, x + 1, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

// интерфейс рисуется в постоянных координатах 960×640 и масштабируется под холст,

const UI_W = 960, UI_H = 640;
function drawHud() {

  } else {
    ctx.fillStyle = '#3a3f44'; roundRect(ctx, 18, 16, 86, 16, 4); ctx.fill();

  }
  text(`Очки ${score}`, 118, 24, 15, '#eef5e8');
  text(campaign ? `Ур. ${wave}/${campaign.length}` : `Волна ${wave}`, 230, 24, 15, '#eef5e8');
  text(`Враги ${toSpawn.length + enemies.length}`, 320, 24, 15, '#eef5e8');
  text(`Металлолом ${scrap}`, 425, 24, 15, '#d9c27a');

  let x = UI_W - 12;

    text(`${I.glyph} ${I.name} ×${player.rail}`, x - 140, 20, 13, I.color);
    text('ПКМ / E', x - 140, 33, 10, '#b9a6d6', 'left', '400');
    x -= 158;
  }
  for (const k of ['shield', 'triple', 'rapid']) {

    ctx.fillStyle = '#3a3f44'; ctx.fillRect(x - 110, 31, 100, 3);
    ctx.fillStyle = I.color; ctx.fillRect(x - 110, 31, Math.min(100, v / CFG.powerupTime * 100), 3);
    x -= 128;
  }

}

function overlay(alpha) { ctx.fillStyle = `rgba(10,14,16,${alpha})`; ctx.fillRect(0, 0, UI_W, UI_H); }

function drawMenu() {
  overlay(.72);
  text('EcoTank', UI_W / 2, 150, 72, '#8be06a', 'center', '800');

// обрезает пустые («не трогать») края, чтобы вес и размещение считались по реальной группе
function trimRows(cells) {
  const used = (y0, y1, x0, x1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (cells[y][x] !== ' ') return true; return false; };
  let top = 0, bottom = cells.length - 1, left = 0, right = cells[0].length - 1;
  while (top <= bottom && !used(top, top, left, right)) top++;

  while (!used(bottom, bottom, left, right)) bottom--;
  while (!used(top, bottom, left, left)) left++;

  document.getElementById('mapSize').hidden=fixed||camp;
  document.getElementById('mapMode').value=['preset01','map','campaign'].includes(CFG.mapMode)?CFG.mapMode:'original';
  if(mapPick.hidden===fixed)mapPick.hidden=!fixed;
  if(fixed&&mapPick.value!==CFG.mapPick)mapPick.value=CFG.mapPick;
  if(campaignPick.hidden===camp)campaignPick.hidden=!camp;
  if(camp){renderCampaignPick();if(campaignPick.value!==String(CFG.campaignStart))campaignPick.value=String(CFG.campaignStart);}
  document.getElementById('mapControl').hidden=editorOpen||mapEdOpen||!(state==='menu'||state==='over');
  if (editorEl.hidden === editorOpen) editorEl.hidden = !editorOpen;
  if (mapEditorEl.hidden === mapEdOpen) mapEditorEl.hidden = !mapEdOpen;
  syncMusic();
  const pm = state === 'pause' && !devOpen, dv = state === 'pause' && devOpen;
  if (pauseMenu.hidden === pm) pauseMenu.hidden = !pm;
  if (devEl.hidden === dv) devEl.hidden = !dv;
}

// ---------- запуск ----------
renderMapPick();
toMenu();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  syncUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
