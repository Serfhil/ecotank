<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ui-text="appTitle"></title>
<style>
  html, body { margin: 0; height: 100%; background: #14181c; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position:fixed; inset:0; }
  #c { position:absolute; }
  #gameHud { position:absolute; overflow:hidden; pointer-events:none; }
  #hudCanvas { width:100%; height:100%; box-shadow:none; border-radius:0; cursor:default; }
  canvas { display: block; cursor: crosshair; box-shadow: 0 0 0 2px #2a3238, 0 12px 40px #000a; border-radius: 4px; }
  [hidden] { display: none !important; }
  button { font: 600 15px "Segoe UI", system-ui, sans-serif; color: #eef5e8; background: #2a3a2c; border: 1px solid #4f7a44; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  button:hover { background: #355238; }
  button.ghost { background: #1d2427; border-color: #3a464c; }
  button.ghost:hover { background: #283236; }
  #pauseMenu { position: fixed; left: 50%; top: calc(50% + 10px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; width: 260px; }
  #dev { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,10,12,.55); }
  #devPanel { width: min(760px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; }
  .devHead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .devHead b { font-size: 18px; color: #8be06a; }
  .devActions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .devActions button { font-size: 13px; padding: 6px 12px; }
  #devPanel h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb39a; }
  #devPanel table { width: 100%; border-collapse: collapse; }
  #devPanel th { text-align: left; font-weight: 700; padding: 4px 6px; }
  #devPanel td { padding: 3px 6px; border-top: 1px solid #222b2f; }
  #devPanel td.na { color: #4a565c; text-align: center; }
  #devPanel input[type=number] { width: 100%; box-sizing: border-box; background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  #devPanel input[type=number]:focus { outline: none; border-color: #6cc24a; }
  #devPanel input[type=checkbox] { width: 18px; height: 18px; accent-color: #6cc24a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 16px; }
  .grid label { display: grid; grid-template-columns: 1fr 86px; align-items: center; gap: 8px; color: #c9d4c4; }
  .note { margin: 16px 0 0; color: #7f8f88; font-size: 12px; }
  #devMsg { margin: 6px 0 0; color: #b9d8a8; } #devMsg:empty { display: none; }
  #editor, #mapEditor { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; background: rgba(8,10,12,.7); }
  .epanel { width: min(860px, calc(100vw - 32px)); max-height: 92vh; overflow: auto; background: #161c1f; border: 1px solid #2f3a40; border-radius: 12px; box-shadow: 0 20px 60px #000c; color: #dde6d8; font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px 20px 20px; box-sizing: border-box; }
  .epanel h3 { margin: 18px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #9fb39a; }
  .epanel button { font-size: 13px; padding: 6px 12px; }
  .epanel input { background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  .epanel input[type=number] { width: 52px; }
  .pe-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-top: 1px solid #222b2f; }
  .pe-row .pe-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pe-row .pe-size { color: #7f8f88; }
  .pe-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
  .pe-palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pe-palette button { display: flex; align-items: center; gap: 6px; }
  .pe-palette button.on { border-color: #8be06a; background: #2a3a2c; }
  .pe-palette .pe-cell { width: 16px; height: 16px; }
  .pe-grid { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; user-select: none; touch-action: none; }
  .pe-grid .pe-cell { width: 30px; height: 30px; cursor: crosshair; }
  .epanel { scrollbar-color: #3a464c #161c1f; }
  .pe-thumb { width: 98px; flex: none; }
  .pe-mini { display: grid; gap: 1px; background: #0b0f11; padding: 1px; width: max-content; }
  .pe-mini .pe-cell { width: 7px; height: 7px; }
  .pe-cell { box-sizing: border-box; }
  .t-none { background: repeating-conic-gradient(#1b2226 0 25%, #252e33 0 50%) 0 0 / 10px 10px; }
  .t-clear { background: #56693f; }
  .t-B, .t-b { background: linear-gradient(#402b21 0 1px, transparent 1px 50%, #402b21 50% calc(50% + 1px), transparent 0) #b3633a; }
  .t-F { background: linear-gradient(#56693f 40%, #a57a46 40% 60%, #56693f 60%); }
  .t-S { background: #9aa6af; border: 3px solid #6f7b85; }
  .t-W { background: #2c6d96; }
  .t-P { background: repeating-linear-gradient(-8deg, #b59e64 0 5px, #c9b277 5px 6px); }
  .t-T, .t-t { background: radial-gradient(circle, #3f8a3a 55%, #2c5e2a 62%, #56693f 64%); }
  .t-b, .t-t { opacity: .5; }
  .t-R { background: repeating-linear-gradient(90deg, transparent 0 7px, #5a5c58 7px 8px), repeating-linear-gradient(0deg, #8a8b86 0 7px, #5a5c58 7px 8px); }
  .t-D { background: linear-gradient(#b3633a, #b3633a) 0 50% / 50% 25% no-repeat, linear-gradient(#b3633a, #b3633a) 0 100% / 75% 25% no-repeat, #56693f; }
  .t-L { background: radial-gradient(circle, #3f8a3a 22%, #2c5e2a 27%, #56693f 30%); }
  .epanel select { background: #0f1416; color: #eef5e8; border: 1px solid #2f3a40; border-radius: 6px; padding: 5px 6px; font: inherit; }
  .pe-pack { border: 1px solid #2f3a40; border-radius: 8px; padding: 8px 12px 4px; margin-top: 12px; }
  .pe-packhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 6px; }
  .pe-pack.folded { padding-bottom: 2px; }
  .pe-pack.folded .pe-packhead { padding-bottom: 6px; }
  .epanel .pe-fold { width: 30px; height: 30px; padding: 0; font-size: 14px; line-height: 1; transition: transform .15s; }
  .pe-pack.folded .pe-fold { transform: rotate(-90deg); }
  .pe-packhead b { flex: 1; min-width: 140px; color: #8be06a; font-size: 14px; }
  .pe-packhead .pe-packname { flex: 1; min-width: 140px; font-weight: 700; }
  .pe-packhead label { display: flex; align-items: center; gap: 6px; }
  .pe-warn { color: #ffc477; margin: 10px 0 0; }
  .pe-msg { min-height: 18px; margin-top: 10px; color: #ff8a7a; }
  .pe-actions { display: flex; gap: 8px; margin-top: 14px; }
  #mapEditorPanel { width: min(1180px, calc(100vw - 32px)); }
  .me-canvas { display: block; cursor: crosshair; touch-action: none; border: 1px solid #0b0f11; }
  .me-thumb { display: block; flex: none; border: 1px solid #0b0f11; }
  .me-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; color: #9fb39a; font-size: 12px; }
  .me-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
  #defeatScreen { position:fixed; inset:0; z-index:50; background:transparent; }
  #defeatScreen[hidden], #defeatRestart[hidden] { display:none; }
  #defeatCanvas { width:100%; height:100%; display:block; border-radius:0; box-shadow:none; cursor:default; }
  #defeatRestart { position:absolute; left:0; right:0; margin:0 auto; bottom:max(28px,7vh); box-sizing:border-box; width:max-content; max-width:calc(100vw - 32px); padding:16px 38px; min-width:min(270px,calc(100vw - 32px)); border:1px solid #edc668; border-radius:6px; color:#ffe7a3; background:linear-gradient(#a63138,#681320); font-size:clamp(17px,2.4vw,23px); font-weight:700; box-shadow:0 6px 28px #0008; }
  #defeatTip { position:absolute; bottom:calc(max(28px,7vh) + 76px); left:50%; transform:translateX(-50%); width:max-content; max-width:min(90vw,46rem); box-sizing:border-box; margin:0; padding:10px 16px; border-radius:6px; background:#18090ddd; color:#ffe7a3; text-align:center; }
  #defeatRestart:hover, #defeatRestart:focus-visible { background:#b73e42; outline:2px solid #edc668; outline-offset:4px; }
</style>

<script src="js/config.js"></script>

<body>
<div id="musicControls" style="position:fixed;top:8px;right:10px;z-index:2;display:flex;align-items:center;gap:8px;background:#14181cdd;padding:5px;border-radius:6px;color:#bbc9b5;font-size:12px">
<button id="musicToggle" style="font-size:11px;padding:5px 8px" aria-label="" data-ui-aria-label="vklyuchit_ili_vyklyuchit_muzyku" data-ui-text="musicToggle"></button><span class="audioLabel" data-ui-text="muzyka"></span><input id="musicVolume" aria-label="" data-ui-aria-label="gromkost_muzyki" type="range" min="0" max="1" step="0.01" value="0.22" style="width:70px"><span class="audioLabel" data-ui-text="obshchaya"></span><input id="gameVolume" aria-label="" data-ui-aria-label="obshchaya_gromkost_igry" type="range" min="0" max="1" step="0.01" value="0.65" style="width:70px"></div>
<button id="menuHome" class="homeButton" hidden data-ui-text="menuHome"></button>
<section id="mainMenu" aria-label="" data-ui-aria-label="glavnoe_menyu_ecotank">
<div class="menuSmoke" aria-hidden="true"></div><div class="menuHero"><img class="menuForeground" src="assets/menu-marx-cutout.png" alt="" data-ui-alt="karl_marks_derzhit_model_tanka"><img class="menuLight" src="assets/menu-marx-cutout.png" alt="" aria-hidden="true"><div class="heroFade"></div><div class="risingTitle"><img class="menuTitleImage" src="assets/ecotank-title.png" alt="ECOTANK"></div><div class="heroCaption" data-ui-text="stal_taktika_obshchee_delo"></div></div>
<div class="menuLower"><div class="menuHeading"><span data-ui-text="vyberi_operatsiyu"></span><small data-ui-text="tankovyy_poligon"></small></div>
<div class="modeButtons"><button id="mode-story" data-ui-leading="modeStory"><small data-ui-text="raseiniaiMission"></small></button><button id="mode-campaign" data-ui-leading="modeCampaign"><small data-ui-text="posledovatelnye_urovni"></small></button><button id="mode-preset01" data-ui-leading="modePresets"><small data-ui-text="gotovye_uchastki"></small></button><button id="mode-map" data-ui-leading="modeMap"><small data-ui-text="vybor_i_redaktor"></small></button></div>
<div class="menuActions"><button id="menuStart" class="startButton" data-ui-text="startBattle"></button><button id="menuSettings" class="ghost" data-ui-text="settings"></button><span data-ui-text="wasd_tank_mysh_bashnya_probel_ogon_shift_uskorenie"></span></div>
<div id="mapControl" style="position:fixed;top:8px;left:10px;z-index:2;background:#14181cdd;padding:7px;color:#d5dfcc;font-size:12px;border-radius:6px" data-ui-leading="mapControl"><select id="mapSize" aria-label="" data-ui-aria-label="razmer_karty_dlya_novoy_igry" style="background:#27332b;color:#eef5e8;border:1px solid #5d7250;padding:4px"><option value="30">30×20</option><option value="45">45×30</option><option value="60">60×40</option></select>
<select id="mapMode" aria-label="" data-ui-aria-label="rezhim_rasstanovki_dekoratsiy_dlya_novoy_igry" style="background:#27332b;color:#eef5e8;border:1px solid #5d7250;padding:4px"><option value="raseiniai" data-ui-text="modeStory"></option><option value="original" data-ui-text="modeOriginal"></option><option value="preset01" data-ui-text="modePresets"></option><option value="map" data-ui-text="modeMap"></option><option value="campaign" data-ui-text="modeCampaign"></option></select>
<select id="campaignPick" aria-label="" data-ui-aria-label="uroven_s_kotorogo_nachat_kampaniyu" hidden style="background:#27332b;color:#eef5e8;border:1px solid #5d7250;padding:4px;max-width:220px"></select>
<select id="mapPick" aria-label="" data-ui-aria-label="gotovaya_karta_dlya_novoy_igry" hidden style="background:#27332b;color:#eef5e8;border:1px solid #5d7250;padding:4px;max-width:200px"></select>
<button id="btnEditor" class="ghost" style="font-size:12px;padding:4px 10px" data-ui-text="btnEditor"></button>
<button id="btnMapEditor" class="ghost" style="font-size:12px;padding:4px 10px" data-ui-text="btnMapEditor"></button></div>
</div></section>
<div id="wrap"><canvas id="c" width="960" height="640"></canvas><aside id="gameHud" hidden aria-label="" data-ui-aria-label="hudTitle"><canvas id="hudCanvas"></canvas></aside></div>
<img id="raseiniaiMill" src="assets/raseiniai/windmill.png" alt="" hidden>
<section id="raseiniaiScreen" hidden aria-label="Расейняй, Литва"></section>
<section id="defeatScreen" hidden tabindex="-1" role="region" aria-label="" data-ui-aria-label="defeatScreen">
  <canvas id="defeatCanvas" aria-hidden="true"></canvas>
  <p id="defeatTip" hidden></p>
  <button id="defeatRestart" hidden data-ui-text="newGame"></button>
</section>
<section id="victoryScreen" hidden tabindex="-1" role="region" data-ui-aria-label="victoryScreen">
  <canvas id="victoryCanvas" aria-hidden="true"></canvas>
  <div id="victoryContent" hidden>
    <h1 data-ui-text="victoryTitle"></h1>
    <div id="victoryCreditsWindow"><div id="victoryCredits"></div></div>
    <article id="victoryAward" hidden>
      <div class="awardStar" aria-hidden="true">★</div>
      <h2 data-ui-text="victoryDecreeTitle"></h2>
      <h3 data-ui-text="victoryDecreeSubject"></h3>
      <p data-ui-text="victoryDecreeThanks"></p>
      <p data-ui-text="victoryDecreeAward"></p>
      <strong data-ui-text="victoryDecreeGlory"></strong>
    </article>
    <nav id="victoryActions">
      <button id="victorySkip" data-ui-text="victoryAwardButton"></button>
      <button id="victoryNew" hidden data-ui-text="newGame"></button>
      <button id="victoryHome" hidden data-ui-text="menuHome"></button>
    </nav>
  </div>
</section>
<div id="pauseMenu" hidden>
  <button id="btnResume" data-ui-text="resume"></button>
  <button id="btnNewGame" class="ghost" data-ui-text="newGame"></button>
  <button id="btnDev" class="ghost" data-ui-text="developerSettings"></button>
</div>
<div id="dev" hidden>
  <div id="devPanel">
    <div class="devHead"><b data-ui-text="developerSettings"></b><button id="btnDevClose" class="ghost" data-ui-text="close"></button></div>
    <div class="devActions">
      <button data-act="heal" class="ghost" data-ui-text="vyzvat_rembrigadu"></button>
      <button data-act="rail" class="ghost" data-ui-text="1_snaryad_iz_nii"></button>
      <button data-act="powerups" class="ghost" data-ui-text="vsyo_luchshee_ekipazhu"></button>
      <button data-act="kill" class="ghost" data-ui-text="vopros_reshyon"></button>
      <button data-act="skip" class="ghost" data-ui-text="sleduyushchiy_eshelon"></button>
      <button data-act="reset" class="ghost" data-ui-text="vernut_shtatnye_normativy"></button>
      <button data-act="export" class="ghost" data-ui-text="eksport_nastroek"></button>
      <button data-act="import" class="ghost" data-ui-text="import_nastroek"></button>
    </div>
    <input type="file" id="devImport" accept=".json,application/json" hidden>
    <p id="devMsg" class="note" role="status"></p>
    <div id="devBody"></div>
    <p class="note" data-ui-text="izmeneniya_primenyayutsya_srazu_i_sokhranyayutsya_v_brauzere_khp_vragov_deystvuet_na_"></p>
  </div>
</div>
<div id="editor" hidden><div id="editorPanel" class="epanel"></div></div>
<div id="mapEditor" hidden><div id="mapEditorPanel" class="epanel"></div></div>
<input type="file" id="mapImport" accept=".json,application/json" hidden>
<script>
'use strict';
bootGame();
</script>
</body>
